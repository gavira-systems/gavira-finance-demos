<style>
/* Layout: a working desk — header with role switch, tab bar, then list-and-detail panes. Gold marks only buttons where a person decides. */
:root {
  --bg: #f3f5f1; --surface: #ffffff; --surface-2: #eef2ee; --line: #d9e1db; --line-2: #c6d0c9;
  --ink: #111a19; --ink-2: #45524f; --ink-3: #66746f;
  --teal: #006d77; --teal-ink: #005c65; --teal-soft: #e0eeee; --on-teal: #ffffff;
  --sage: #899670; --sage-soft: #a3b18a;
  --gold: #ffd166; --gold-ink: #2b2100; --gold-line: #e9b53a;
  --good: #2e7744; --good-soft: #e2f0e5; --warn: #8f5600; --warn-soft: #f7ead3; --bad: #a93224; --bad-soft: #f7e0dc;
  --age0: #a3b18a; --age1: #6fa6ab; --age2: #e0ad45; --age3: #d4774e; --age4: #a93224;
  --shadow: 0 1px 2px rgb(17 26 25 / .06), 0 4px 16px rgb(17 26 25 / .05);
  --f-display: 'Playfair Display', Georgia, serif;
  --f-body: 'Lato', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1517; --surface: #101e21; --surface-2: #162a2e; --line: #22383c; --line-2: #2d4549;
  --ink: #f1f4ee; --ink-2: #b9c6c3; --ink-3: #8c9fa1;
  --teal: #0c7c86; --teal-ink: #5cc4cb; --teal-soft: #12353a; --on-teal: #ffffff;
  --good: #7cc493; --good-soft: #163128; --warn: #e6ad55; --warn-soft: #33290f; --bad: #f08c7e; --bad-soft: #3a1d19;
  --age0: #7f8c69; --age1: #4f8f95; --age2: #c9973a; --age3: #c86b44; --age4: #d65a48;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .25);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0b1517; --surface: #101e21; --surface-2: #162a2e; --line: #22383c; --line-2: #2d4549;
  --ink: #f1f4ee; --ink-2: #b9c6c3; --ink-3: #8c9fa1;
  --teal: #0c7c86; --teal-ink: #5cc4cb; --teal-soft: #12353a; --on-teal: #ffffff;
  --good: #7cc493; --good-soft: #163128; --warn: #e6ad55; --warn-soft: #33290f; --bad: #f08c7e; --bad-soft: #3a1d19;
  --age0: #7f8c69; --age1: #4f8f95; --age2: #c9973a; --age3: #c86b44; --age4: #d65a48;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1240px; margin: 0 auto; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal-ink); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.label { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }

.demo { margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 8px max(16px, env(safe-area-inset-left, 0px)); background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); text-align: center; }
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 18px 14px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-right: auto; }
.brand h1 { font-family: var(--f-display); font-weight: 600; font-size: 26px; letter-spacing: -.01em; }
.brand .co { color: var(--ink-2); font-size: 13.5px; }
.roles { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); padding: 4px; border-radius: 12px; flex-wrap: wrap; }
.roles button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; cursor: pointer; text-align: left; line-height: 1.25; }
.roles button span { display: block; font-size: 11px; color: var(--ink-3); }
.roles button[aria-pressed="true"] { background: var(--surface); box-shadow: var(--shadow); }
.roles .as { align-self: center; padding: 0 6px 0 8px; font-size: 11.5px; color: var(--ink-3); }
nav.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
nav.tabs a { padding: 10px 14px; text-decoration: none; color: var(--ink-2); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 700; font-size: 14px; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--teal); }
nav.tabs .count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 10px; background: var(--teal-soft); color: var(--teal-ink); font-size: 12px; text-align: center; }
main { padding-top: 22px; display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
main > *, .panel, .split > *, .grid2 > * { min-width: 0; }
.pagehead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.pagehead h2 { font-family: var(--f-display); font-weight: 600; font-size: 24px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.pad { padding: 18px 20px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 16px 18px; display: grid; gap: 4px; align-content: start; }

.kpi .sub { font-size: 13px; color: var(--ink-2); }

.split { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }

.ageing { display: flex; height: 22px; border-radius: 6px; overflow: hidden; margin: 12px 0 10px; background: var(--surface-2); }
.ageing span { display: block; height: 100%; }
.legend { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.legend div { display: grid; gap: 2px; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
.legend b { font-weight: 500; color: var(--ink); font-size: 14px; }

.list { display: grid; }
.row { display: grid; gap: 4px; padding: 12px 16px; border-top: 1px solid var(--line); text-align: left; background: transparent; border-left: 3px solid transparent; border-right: 0; border-bottom: 0; cursor: pointer; width: 100%; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--surface-2); }
.row[aria-selected="true"] { background: var(--teal-soft); border-left-color: var(--teal); }
.row .r1 { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.row .name { font-weight: 700; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.teal { background: var(--teal-soft); color: var(--teal-ink); border-color: transparent; }
.grade { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; font-weight: 900; font-size: 13px; }
.grade.A { background: var(--good-soft); color: var(--good); } .grade.B { background: var(--teal-soft); color: var(--teal-ink); }
.grade.C { background: var(--warn-soft); color: var(--warn); } .grade.D { background: var(--bad-soft); color: var(--bad); }

.btn { border: 1px solid var(--line-2); background: var(--surface); padding: 9px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { background: var(--surface-2); }
.btn.teal { background: var(--teal); color: var(--on-teal); border-color: var(--teal); }
.btn.teal:hover { filter: brightness(1.08); }
.btn.gold { background: var(--gold); color: var(--gold-ink); border-color: var(--gold-line); }
.btn.gold:hover { filter: brightness(.97); }
.btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
.btn.link { border: 0; background: transparent; padding: 4px 2px; color: var(--teal-ink); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.gate { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 8px; background: var(--surface-2); color: var(--ink-2); font-size: 13.5px; }

.detail { display: grid; gap: 18px; padding: 20px 22px; }
.dhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: start; }
.dhead h3 { font-size: 20px; font-weight: 900; }
.amounts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.amounts div { padding: 12px 14px; display: grid; gap: 2px; border-left: 1px solid var(--line); }
.amounts div:first-child { border-left: 0; }
.amounts .v { font-size: 20px; font-weight: 500; }
.amounts .hl { background: var(--teal-soft); }
.steps { display: flex; flex-wrap: wrap; gap: 6px 4px; list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
.steps li { display: flex; align-items: center; gap: 6px; color: var(--ink-3); }
.steps li::after { content: ''; width: 18px; height: 1px; background: var(--line-2); margin-left: 4px; }
.steps li:last-child::after { display: none; }
.steps li.done { color: var(--ink-2); }
.steps li.now { color: var(--ink); font-weight: 700; }
.steps .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); }
.steps .done .dot { background: var(--sage); }
.steps .now .dot { background: var(--gold); box-shadow: 0 0 0 3px rgb(255 209 102 / .35); }

table { border-collapse: collapse; width: 100%; }
.tablewrap { overflow-x: auto; }
th { text-align: left; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.pts { font-family: var(--f-mono); font-weight: 500; }
.pts.pos { color: var(--good); } .pts.neg { color: var(--bad); }
.src { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.ceil { display: grid; gap: 6px; font-size: 13.5px; }
.ceil div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 10px; border-radius: 6px; }
.ceil .bind { background: var(--teal-soft); font-weight: 700; }
.note { white-space: pre-wrap; font-size: 13.5px; line-height: 1.55; background: var(--surface-2); padding: 14px 16px; border-radius: 8px; border: 1px solid var(--line); }
.usage { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); min-width: 90px; overflow: hidden; }
.usage span { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
.usage::after { content: ''; position: absolute; top: -2px; bottom: -2px; left: calc(100% / 1.2); width: 2px; background: var(--ink-3); opacity: .5; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.form { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface-2); }
.form label { display: grid; gap: 4px; font-size: 13px; font-weight: 700; }
.form input, .form textarea { border: 1px solid var(--line-2); background: var(--surface); border-radius: 6px; padding: 8px 10px; font-weight: 400; }
.form .err { color: var(--bad); font-size: 13px; }
textarea.draft { width: 100%; min-height: 180px; border: 1px solid var(--line-2); border-radius: 8px; padding: 12px 14px; background: var(--surface); line-height: 1.55; resize: vertical; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--teal-soft); color: var(--teal-ink); font-weight: 700; }
.wa { background: #e7f1e4; color: #0b141a; border-radius: 10px; padding: 14px; display: grid; gap: 8px; }
.wa .bubble { background: #ffffff; border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; font-size: 14px; box-shadow: 0 1px 1px rgb(0 0 0 / .08); max-width: 520px; }
.wa .meta { font-size: 11.5px; color: #54656f; }

.decide { display: grid; gap: 2px; }
.decide a { display: flex; justify-content: space-between; gap: 12px; padding: 12px 4px; border-top: 1px solid var(--line); text-decoration: none; color: inherit; align-items: center; }
.decide a:first-child { border-top: 0; }
.decide a:hover .go { text-decoration: underline; }
.decide .go { color: var(--teal-ink); font-weight: 700; font-size: 13px; white-space: nowrap; }
.guide { border-color: var(--gold-line); }
.guide ol { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; }
.guide a { color: var(--teal-ink); font-weight: 700; }
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.how div { padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); display: grid; gap: 6px; align-content: start; }
.how div.person { border-color: var(--gold-line); background: color-mix(in srgb, var(--gold) 14%, var(--surface)); }
.how b { font-size: 15px; }
.spark { width: 100%; height: 64px; display: block; }
.months { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-3); margin-top: 4px; }
.months span { display: grid; justify-items: center; gap: 1px; }
.months b { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.conn td:first-child { font-weight: 700; }
.ok { color: var(--good); font-weight: 700; } .cfg { color: var(--warn); font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); z-index: 20; max-width: min(560px, calc(100vw - 32px)); }
.legend-gold { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-3); }
.legend-gold i { width: 12px; height: 12px; border-radius: 3px; background: var(--gold); border: 1px solid var(--gold-line); }
.empty { padding: 28px; text-align: center; color: var(--ink-3); }
@media (max-width: 980px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid2, .split { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) { .roles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; } .roles .as { grid-column: 1 / -1; padding: 2px 6px; } .roles button { padding: 6px 8px; font-size: 13.5px; } .legend { grid-template-columns: repeat(2, minmax(0, 1fr)); } .how { grid-template-columns: minmax(0, 1fr); } .amounts { grid-template-columns: minmax(0, 1fr); } .amounts div { border-left: 0; border-top: 1px solid var(--line); } .amounts div:first-child { border-top: 0; } .brand h1 { font-size: 22px; } .detail { padding: 16px; } }
@media (prefers-reduced-motion: no-preference) { .row, .btn, nav.tabs a { transition: background-color .15s, border-color .15s, filter .15s; } }
</style>

<script>
// PAN and GSTIN checks. Self-contained so it can be pasted into an n8n Code node
// or inlined into a page; exposes itself on globalThis.Credit and module.exports.
(function (root) {
  const CHARS = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const PAN_RE = /^[A-Z]{5}[0-9]{4}[A-Z]$/;
  const GSTIN_RE = /^[0-9]{2}[A-Z0-9]{10}[0-9A-Z]Z[0-9A-Z]$/;

  function normalizeId(s) {
    return String(s == null ? '' : s).replace(/\s+/g, '').toUpperCase();
  }

  function validatePAN(pan) {
    return PAN_RE.test(normalizeId(pan)) ? { ok: true } : { ok: false, reason: 'format' };
  }

  // Check digit: base-36 values, factors alternate 1,2 over the first 14 characters.
  function gstinCheckDigit(first14) {
    let sum = 0;
    for (let i = 0; i < 14; i++) {
      const p = CHARS.indexOf(first14[i]) * (i % 2 === 0 ? 1 : 2);
      sum += Math.floor(p / 36) + (p % 36);
    }
    return CHARS[(36 - (sum % 36)) % 36];
  }

  function validateGSTIN(gstin, pan) {
    const g = normalizeId(gstin);
    if (!GSTIN_RE.test(g)) return { ok: false, reason: 'format' };
    const state = Number(g.slice(0, 2));
    if (state < 1 || state > 38) return { ok: false, reason: 'state' };
    const embedded = g.slice(2, 12);
    if (!PAN_RE.test(embedded)) return { ok: false, reason: 'format' };
    if (pan != null && normalizeId(pan) !== embedded) return { ok: false, reason: 'pan-mismatch' };
    if (gstinCheckDigit(g.slice(0, 14)) !== g[14]) return { ok: false, reason: 'checksum' };
    return { ok: true, stateCode: g.slice(0, 2), pan: embedded };
  }

  const api = { normalizeId, validatePAN, validateGSTIN, gstinCheckDigit };
  root.Credit = Object.assign(root.Credit || {}, api);
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

// Reading amounts and dates as Indian ledgers and Excel exports write them.
(function (root) {
  const MONTHS = { JAN: 1, FEB: 2, MAR: 3, APR: 4, MAY: 5, JUN: 6, JUL: 7, AUG: 8, SEP: 9, OCT: 10, NOV: 11, DEC: 12 };

  function parseAmount(v) {
    if (typeof v === 'number') return v;
    let s = String(v == null ? '' : v).trim();
    const negative = /^\(.*\)$/.test(s) || /^-/.test(s);
    s = s.replace(/[()₹\s-]/g, '').replace(/^Rs\.?/i, '');
    let mult = 1;
    if (/cr(ore)?s?$/i.test(s)) { mult = 1e7; s = s.replace(/cr(ore)?s?$/i, ''); }
    else if (/(l|lakh|lakhs|lac|lacs)$/i.test(s)) { mult = 1e5; s = s.replace(/(lakhs|lakh|lacs|lac|l)$/i, ''); }
    const n = Number(s.replace(/,/g, ''));
    if (!Number.isFinite(n)) return NaN;
    return Math.round(n * mult * 100) / 100 * (negative ? -1 : 1);
  }

  function iso(y, m, d) {
    const dt = new Date(Date.UTC(y, m - 1, d));
    if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return null;
    return dt.toISOString().slice(0, 10);
  }

  // Excel serial 25569 = 1970-01-01.
  function fromSerial(n) {
    return new Date(Math.round((n - 25569) * 86400000)).toISOString().slice(0, 10);
  }

  function parseDate(v) {
    if (typeof v === 'number') return fromSerial(v);
    const s = String(v == null ? '' : v).trim();
    if (/^\d{5}(\.\d+)?$/.test(s)) return fromSerial(Number(s));
    let m;
    if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return iso(+m[1], +m[2], +m[3]);
    if ((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/))) return iso(+m[3], +m[2], +m[1]);
    if ((m = s.match(/^(\d{1,2})[\s\-]([A-Za-z]{3})[A-Za-z]*[\s\-,]+(\d{4})$/))) {
      const mon = MONTHS[m[2].toUpperCase()];
      return mon ? iso(+m[3], mon, +m[1]) : null;
    }
    return null;
  }

  const api = { parseAmount, parseDate };
  root.Credit = Object.assign(root.Credit || {}, api);
  if (typeof module !== 'undefined' && module.exports) module.exports = api;

  const rows = S.invoices.map((i) => ({ customerId: i.customerId, invoiceNo: i.id, amount: i.amount, dueDate: i.dueDate }));
  const cs = S.customers.map((c) => ({ ...c, contact: c.contact, contactEmail: c.contactEmail, ...c.grade }));
  return C.collections(rows, cs, TODAY);
}

function log(actor, actorType, action, record, detail, evidence, at) {
  S.audit.unshift({ at: at || new Date().toISOString(), actor, actorType, action, record, detail, evidence });
}
// Seed the audit log with what the n8n flows did before today's session.
(function seedAudit() {
  const t = (h, m) => '2026-10-31T' + String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':00+05:30';
  const seed = [];
  for (const a of S.apps) {
    seed.push([a.createdAt, a.requestedBy.startsWith('Sales') ? a.requestedBy : 'Credit Desk', a.requestedBy.startsWith('Sales') ? 'person' : 'system', 'Application received', a.id, a.legalName + ' asked for ' + lakh(a.requested), 'n8n form · flow 1']);
    seed.push([a.createdAt, 'Credit Desk', 'system', 'GST filing record fetched', a.id, a.inputs.gstOnTime12 + ' of 12 GSTR-3B on time', 'GST portal via GSP (sample response)']);
    seed.push([a.createdAt, 'Credit policy', 'system', 'Policy applied', a.id, 'Grade ' + a.grade + ', recommended ' + lakh(a.recommended) + ' (' + a.binding + ')', 'Policy rules v2026-10']);
    seed.push([a.createdAt, 'AI', 'ai', 'Credit note drafted', a.id, 'Note written for analyst review', 'Numbers from policy rules']);
    if (a.status === 'awaiting_approval') seed.push([a.createdAt, PEOPLE.analyst.name, 'person', 'Submitted for approval', a.id, 'Sent to ' + PEOPLE[a.approverRole].name, 'Credit Desk · flow 2']);
  }
  seed.push([t(6, 0), 'Credit Desk', 'system', 'Daily ledger check', 'Ledger', '53 open invoices read, ageing rebuilt', 'Tally ledger (Google Sheet in demo) · flow 4']);
  seed.push([t(6, 0), 'Credit Desk', 'system', 'Account on hold', 'C05', 'Brahmaputra Industrial Supplies: invoice 121 days overdue', 'Hold rule: over 90 days']);
  seed.push([t(6, 1), 'AI', 'ai', 'Reminders drafted', 'Collections', '12 reminders drafted for approval', 'Templates by age · flow 4']);
  for (const o of DATA.orders) {
    const v = orderView(o);
    seed.push([o.placedAt, o.placedBy, 'person', 'Order placed', o.id, v.customer.name + ' · ' + lakh(o.amount), 'ERP · flow 3']);
    seed.push([o.placedAt, 'Credit Desk', 'system', v.status === 'released' ? 'Order released automatically' : 'Order held', o.id, v.decision.reason, 'Credit policy order check']);
  }
  seed.sort((a, b) => b[0].localeCompare(a[0])).forEach((r) => S.audit.push({ at: r[0], actor: r[1], actorType: r[2], action: r[3], record: r[4], detail: r[5], evidence: r[6] }));
})();

function decisionsWaiting() {

    .concat(a.ceilings.newCap ? [['New-customer cap, first 90 days', a.ceilings.newCap, 'newCap']] : [])
    .concat(a.ceilings.stepUp ? [['Largest step up (60% above ' + lakh(a.currentLimit) + ')', a.ceilings.stepUp, 'stepUp']] : []);

    <div class="amounts">
      <div><span class="label">Asked for</span><span class="v num">${lakh(a.requested)}</span></div>
      <div class="hl"><span class="label">Recommended</span><span class="v num">${lakh(a.recommended)}</span></div>

    ${act}
    <section><h4 class="label" style="margin-bottom:8px">What was checked</h4><div class="tablewrap"><table>

function orderRow(o) {
  const after = o.decision.usagePctAfter ? o.decision.usagePctAfter.toFixed(1) + '%' : '—';
  const need = o.decision.approver || 'fc';
  let cell;
  if (o.status === 'released') cell = `<span class="chip good">Released</span><span class="src">${esc(o.by)}</span>`;
  else if (o.status === 'released_by_approver') cell = `<span class="chip good">Released once</span><span class="src">${esc(o.by)} · ${esc(o.reason)}</span>`;
  else if (o.status === 'held_confirmed') cell = `<span class="chip bad">Kept on hold</span><span class="src">${esc(o.by)}</span>`;
  else if (S.form && S.form.id === o.id) cell = `<form class="form" data-act="submitRelease" data-id="${o.id}"><label>Reason to release (required)<textarea id="f-reason" rows="2" placeholder="e.g. part payment received, UTR …">${esc(S.form.reason || '')}</textarea></label>${S.form.error ? `<span class="err">${esc(S.form.error)}</span>` : ''}<div class="actions"><button class="btn gold" type="submit">Release once</button><button class="btn link" type="button" data-act="closeForm">Cancel</button></div></form>`;
  else if (C.canApprove(S.role, 'analyst', need)) cell = `<div class="actions"><button class="btn gold" data-act="openRelease" data-id="${o.id}">Release once</button><button class="btn" data-act="keepHold" data-id="${o.id}">Keep on hold</button></div>`;
  else cell = `<span class="chip warn">Held</span><span class="src">Waiting for ${esc(PEOPLE[need].name)}${need === 'cfo' ? ' (over 20% above limit)' : ''}</span>`;
  return `<tr><td class="num">${o.id}<span class="src">${esc(o.placedBy)}</span></td><td><b>${esc(o.customer.name)}</b></td><td class="r num">${lakh(o.amount)}</td><td class="r num">${after}</td><td class="small">${esc(o.decision.reason)}</td><td style="min-width:220px">${cell}</td></tr>`;
}

function viewCollections() {

  const c = col.chase.find((x) => x.customerId === S.selChase);
  const pending = col.chase.filter((x) => !S.chase[x.customerId]);
  const canSend = S.role !== 'analyst';
  const st = (id) => S.chase[id];
  const stChip = (id) => { const s = st(id); return !s ? '' : s.status === 'sent' ? '<span class="chip good">Sent</span>' : s.status === 'promise' ? '<span class="chip teal">Promise logged</span>' : '<span class="chip">Skipped today</span>'; };
  return `
  <div class="pagehead"><h2>Collections</h2><span class="muted small">Drafted at 06:00 by flow 4 · ${money(col.totals.overdue)} overdue across ${col.chase.length} customers</span></div>
  <section class="panel pad pagehead">
    <span>${pending.length ? `<b>${pending.length} reminders</b> drafted and waiting. Most urgent first, ranked by amount, age, grade and broken promises.` : '<b>All reminders handled for today.</b>'}</span>
    ${canSend ? `<button class="btn gold" data-act="sendAll" ${pending.length ? '' : 'disabled'}>Approve and send all ${pending.length || ''}</button>` : `<span class="gate">${esc(PEOPLE.fc.name)} approves reminders. You can edit drafts and log promises.</span>`}
  </section>
  <div class="split">
    <div class="panel list" aria-label="Customers to chase">${col.chase.map((x, i) => `
      <button class="row" aria-current="${x.customerId === S.selChase}" aria-selected="${x.customerId === S.selChase}" data-act="selChase" data-id="${x.customerId}">
        <span class="r1"><span class="name"><span class="muted num">${i + 1}.</span> ${esc(x.name)}</span><span class="num">${lakh(x.overdue)}</span></span>
        <span class="r1"><span class="muted small">oldest ${x.oldestDays} days</span><span style="display:flex;gap:4px">${stChip(x.customerId) || stageChip[x.stage]}</span></span>
      </button>`).join('')}</div>
    <article class="panel">${c ? chaseDetail(c, canSend) : '<p class="empty">No one to chase.</p>'}</article>
  </div>`;
}

function chaseDetail(c, canSend) {
  const s = S.chase[c.customerId];
  const text = S.edits[c.customerId] ?? c.message;
  const edited = S.edits[c.customerId] != null && S.edits[c.customerId] !== c.message;
  const preview = S.channel === 'email'
    ? `<label class="label" for="draft">Email to ${esc(c.contact)} · ${esc(c.email)}</label><p class="small" style="margin:6px 0"><b>Subject:</b> ${esc(c.subject)}</p><textarea class="draft" id="draft" data-id="${c.customerId}" ${s ? 'readonly' : ''}>${esc(text)}</textarea>`
    : `<div class="wa"><span class="meta">WhatsApp Business · utility template (pre-approved by Meta) · set up at install</span><div class="bubble">${esc(text.split('\n\n')[0])}</div><span class="meta">Sarvam Polymers accounts · ${esc(c.contact)}</span></div>`;
  let act;
  if (s) act = `<div class="gate">${s.status === 'sent' ? 'Sent by ' + esc(s.by) + (s.edited ? ' (edited)' : '') : s.status === 'promise' ? 'Promise to pay <span class="num">' + lakh(s.amount) + '</span> by ' + fmtDate(s.date) + ', logged by ' + esc(s.by) : 'Skipped today by ' + esc(s.by)}</div>`;
  else if (S.form && S.form.id === c.customerId) act = `<form class="form" data-act="submitPromise" data-id="${c.customerId}"><b>Log a promise to pay</b><label>Amount (₹ lakh)<input id="f-amount" type="number" min="0.1" step="0.1" inputmode="decimal" value="${esc(S.form.amount || '')}"></label><label>By date<input id="f-date" type="date" min="${TODAY}" value="${esc(S.form.date || '')}"></label>${S.form.error ? `<span class="err">${esc(S.form.error)}</span>` : ''}<div class="actions"><button class="btn teal" type="submit">Log promise</button><button class="btn link" type="button" data-act="closeForm">Cancel</button></div></form>`;
  else act = `<div class="actions">${canSend ? `<button class="btn gold" data-act="sendOne" data-id="${c.customerId}">Approve and send</button>` : ''}<button class="btn" data-act="openPromise" data-id="${c.customerId}">Log promise to pay</button><button class="btn link" data-act="skip" data-id="${c.customerId}">Skip today</button>${edited ? '<span class="chip teal">Edited</span>' : ''}</div>`;
  return `<div class="detail">
    <div class="dhead"><div><span class="label">${stageChip[c.stage].replace(/<[^>]+>/g, '')} · ${esc(c.why)}</span><h3>${esc(c.name)}</h3></div><div class="seg" role="group" aria-label="Channel"><button aria-pressed="${S.channel === 'email'}" data-act="channel" data-k="email">Email</button><button aria-pressed="${S.channel === 'whatsapp'}" data-act="channel" data-k="whatsapp">WhatsApp</button></div></div>
    <div>${preview}</div>
    ${act}
    <section><h4 class="label" style="margin-bottom:8px">Overdue invoices</h4><div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Due</th><th class="r">Days late</th><th class="r">Amount</th></tr></thead><tbody>${c.invoices.map((i) => `<tr><td class="num">${i.invoiceNo}</td><td>${fmtDate(i.dueDate)}</td><td class="r num">${C.daysBetween(i.dueDate, TODAY)}</td><td class="r num">${lakh(i.amount)}</td></tr>`).join('')}</tbody></table></div></section>
  </div>`;
}

function viewAudit() {
  const f = S.auditFilter;
  const rows = S.audit.filter((r) => f === 'all' || (f === 'people' ? r.actorType === 'person' : r.actorType !== 'person'));
  return `
  <div class="pagehead"><h2>Audit log</h2><span class="muted small">Every step, who or what did it, and the evidence · ${S.audit.length} entries</span></div>
  <section class="panel">
    <div class="pad pagehead"><span class="muted small">Newest first. In a live install this is the n8n audit table, kept with the client.</span><div class="filters" role="group" aria-label="Filter log">${[['all', 'All'], ['people', 'People'], ['machine', 'AI and system']].map(([k, l]) => `<button aria-pressed="${f === k}" data-act="auditFilter" data-k="${k}">${l}</button>`).join('')}</div></div>
    <div class="tablewrap"><table>
      <thead><tr><th>When</th><th>Who</th><th>What</th><th>Record</th><th>Detail and evidence</th></tr></thead>
      <tbody>${rows.map((r) => `<tr><td class="num small" style="white-space:nowrap">${new Date(r.at).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Kolkata' })}</td><td><b>${esc(r.actor)}</b><span class="src">${r.actorType === 'ai' ? 'AI' : r.actorType === 'person' ? 'Person' : 'System'}</span></td><td>${esc(r.action)}</td><td class="num small">${esc(r.record)}</td><td class="small">${esc(r.detail)}<span class="src">${esc(r.evidence)}</span></td></tr>`).join('')}</tbody>
    </table></div>
  </section>`;
}

function viewConnections() {
  const rows = [
    ['Excel / CSV upload', 'Live in demo', 'Ageing reports from any accounting system, columns matched by name', 'Nothing: drop a file into the upload form', 'A file of approved limits to import'],
    ['Google Sheet (stands in for the ledger)', 'Live in demo', 'Customers, invoices, orders, payments', 'Nothing', 'Limits, holds, order decisions'],
    ['Gmail or Microsoft 365', 'Live in demo', 'Approve and decline answers', 'A mailbox the flows can send from', 'Approval requests, reminders'],
    ['TallyPrime', 'Configured', 'Bills receivable, party masters (XML on port 9000)', 'A small agent inside your network; the Tally port is never exposed', 'Nothing: limits stay in the Credit Desk'],
    ['Zoho Books', 'Configured', 'Invoices, payments (REST API, India data centre)', 'An API connection and the organisation ID', 'Customer credit limit'],
    ['SAP S/4HANA or Business One', 'Configured', 'Open items, credit master data (OData / Service Layer)', 'API user; credit role assigned to each business partner', 'Credit limit via API_CRDTMBUSINESSPARTNER'],
    ['GST data via a GSP', 'Configured', 'Customer filing record, GSTIN status', 'An account with a GST Suvidha Provider (billed per call)', 'Nothing'],
    ['Credit bureau report', 'Upload', 'Company credit report and rank', 'Your bureau membership; otherwise upload the PDF', 'Nothing'],
    ['WhatsApp Business', 'Configured', 'Delivery status', 'A WhatsApp Business account and approved utility templates', 'Payment reminders'],
  ];
  return `
  <div class="pagehead"><h2>Connections</h2><span class="muted small">What this desk reads, what it writes back, and what we need from your IT team</span></div>
  <section class="panel"><div class="tablewrap"><table class="conn">
    <thead><tr><th>System</th><th>Status</th><th>What we read</th><th>What we write back</th><th>What we need from you</th></tr></thead>
    <tbody>${rows.map(([n, s, r, need, w]) => `<tr><td>${n}</td><td class="${s === 'Live in demo' ? 'ok' : 'cfg'} small">${s}</td><td class="small">${r}</td><td class="small">${w}</td><td class="small">${need}</td></tr>`).join('')}</tbody>
  </table></div></section>
  <div class="grid2">
    <section class="panel pad"><h3 class="label" style="margin-bottom:10px">How it runs</h3>
      <div class="ceil">
        <div><span>1 · Application and credit read</span><span class="muted">form → KYC → GST → policy → note</span></div>
        <div><span>2 · Approval and write-back</span><span class="muted">approval matrix → email → ledger</span></div>
        <div><span>3 · Order release check</span><span class="muted">every order → release or hold</span></div>
        <div><span>4 · Daily monitoring and collections</span><span class="muted">06:00 → ageing → holds → reminders</span></div>
      </div>
      <p class="muted small" style="margin-top:10px">Built as n8n workflows: visual, readable by your IT team, and running in your own cloud account.</p>
    </section>
    <section class="panel pad"><h3 class="label" style="margin-bottom:10px">Controls</h3>
      <ul class="small" style="margin:0;padding-left:18px;display:grid;gap:6px">
        <li>The AI drafts; written rules set every limit; a person approves.</li>
        <li>Approval matrix: up to ₹50 L the finance controller, above that the CFO. The preparer never approves.</li>
        <li>Every number shows its source and time; every step is in the audit log.</li>
        <li>Data stays in your systems and your cloud account. Nothing is exposed to the internet.</li>
        <li>We do not pull customers' bank or GST data through the Account Aggregator network: only regulated lenders can.</li>
      </ul>
    </section>
  </div>`;
}

// ---------- render ----------
function render() {
  document.getElementById('roles').innerHTML = '<span class="as">Viewing as</span>' + ['analyst', 'fc', 'cfo'].map((r) => `<button aria-pressed="${S.role === r}" data-act="role" data-role="${r}">${esc(PEOPLE[r].name)}<span>${ROLE_LABEL[r]}</span></button>`).join('');
  const w = decisionsWaiting();
  const counts = { applications: w.apps.length, exposure: w.orders.length, collections: w.reminders.length };
  document.getElementById('tabs').innerHTML = VIEWS.map(([k, l]) => `<a href="#${k}" data-act="goto" data-view="${k}" ${S.view === k ? 'aria-current="page"' : ''}>${l}${counts[k] ? `<span class="count num">${counts[k]}</span>` : ''}</a>`).join('');
  const v = { overview: viewOverview, applications: viewApplications, exposure: viewExposure, collections: viewCollections, audit: viewAudit, connections: viewConnections }[S.view];
  document.getElementById('main').innerHTML = v();
}

// ---------- actions ----------
function approveApp(a, amount, reason) {
  const who = me();
  a.status = 'approved';
  a.decision = { by: who.name, role: S.role, amount, reason, at: new Date().toISOString() };
  if (a.kind === 'new') {
    const next = 'C' + String(Math.max(...S.customers.map((c) => Number(c.id.slice(1)))) + 1).padStart(2, '0');
    S.customers.push({ id: next, name: a.legalName, city: a.city, gstin: a.gstin, pan: a.pan, contact: 'Accounts team', contactEmail: 'tapti@example.com', terms: a.terms, limit: amount, status: 'active', since: 2026, grade: a.inputs, turnover: a.turnover });
    a.customerId = next;
  } else {
    S.customers.find((c) => c.id === a.customerId).limit = amount;
  }
  log(who.name, 'person', 'Approved', a.id, lakh(amount) + ' for ' + a.legalName + (reason ? ' · ' + reason : ''), 'Approve button · Credit Desk');
  log('Credit Desk', 'system', 'Limit written to ledger', a.id, (a.kind === 'new' ? 'New customer ' + a.customerId + ' created' : 'Limit updated') + ' at ' + lakh(amount), 'Ledger write-back · flow 2');
  toast('Approved ' + lakh(amount) + ' for ' + a.legalName + '. Written to the ledger.');
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t || t.tagName === 'FORM') return;
  const act = t.dataset.act, id = t.dataset.id;
  if (act === 'goto') { e.preventDefault(); S.view = t.dataset.view; S.form = null; if (id && S.view === 'applications') S.selApp = id; history.replaceState(null, '', '#' + S.view); render(); window.scrollTo({ top: 0 }); return; }
  if (act === 'role') { S.role = t.dataset.role; S.form = null; try { localStorage.setItem('creditDeskRole', S.role); } catch (err) {} render(); return; }
  if (act === 'selApp') { S.selApp = id; S.form = null; render(); return; }
  if (act === 'selChase') { S.selChase = id; S.form = null; render(); return; }
  if (act === 'filter') { S.filter = t.dataset.k; render(); return; }
  if (act === 'auditFilter') { S.auditFilter = t.dataset.k; render(); return; }
  if (act === 'channel') { S.channel = t.dataset.k; render(); return; }
  if (act === 'hideGuide') { S.guide = false; try { localStorage.setItem('creditDeskGuide', 'hidden'); } catch (err) {} render(); return; }
  if (act === 'restart') { try { localStorage.removeItem('creditDeskRole'); } catch (err) {} location.hash = 'overview'; location.reload(); return; }
  if (act === 'closeForm') { S.form = null; render(); return; }
  if (act === 'openForm') { S.form = { id, kind: t.dataset.kind }; render(); document.getElementById(t.dataset.kind === 'different' ? 'f-amount' : 'f-reason')?.focus(); return; }
  if (act === 'openRelease') { S.form = { id }; render(); document.getElementById('f-reason')?.focus(); return; }
  if (act === 'openPromise') { S.form = { id }; render(); document.getElementById('f-amount')?.focus(); return; }
  if (act === 'submitApp') {
    const a = S.apps.find((x) => x.id === id);
    a.status = 'awaiting_approval'; a.preparedByRole = 'analyst';
    log(me().name, 'person', 'Submitted for approval', a.id, 'Sent to ' + PEOPLE[a.approverRole].name, 'Credit Desk · flow 2');
    toast('Submitted. ' + PEOPLE[a.approverRole].name + ' has been asked to approve it.'); render(); return;
  }
  if (act === 'approve') { const a = S.apps.find((x) => x.id === id); approveApp(a, a.recommended, ''); render(); return; }
  if (act === 'keepHold') { S.orders[id] = { status: 'held_confirmed', by: me().name, reason: 'Kept on hold' }; log(me().name, 'person', 'Order kept on hold', id, 'Order stays held', 'Credit Desk · flow 3'); toast('Order ' + id + ' stays on hold. Sales has been told.'); render(); return; }
  if (act === 'sendOne' || act === 'skip') {
    const c = collectionsNow().chase.find((x) => x.customerId === id);
    const edited = S.edits[id] != null && S.edits[id] !== c.message;
    S.chase[id] = { status: act === 'sendOne' ? 'sent' : 'skipped', by: me().name, edited };
    log(me().name, 'person', act === 'sendOne' ? 'Reminder sent' : 'Reminder skipped', id, c.subject + (edited ? ' (edited)' : ''), act === 'sendOne' ? 'Approved on the Credit Desk' : 'Skipped for today');
    toast(act === 'sendOne' ? 'Reminder to ' + c.name + ' approved and sent (demo: nothing leaves this page).' : c.name + ' skipped for today.'); render(); return;
  }
  if (act === 'sendAll') {
    const list = collectionsNow().chase.filter((x) => !S.chase[x.customerId]);
    for (const c of list) S.chase[c.customerId] = { status: 'sent', by: me().name, edited: S.edits[c.customerId] != null && S.edits[c.customerId] !== c.message };
    log(me().name, 'person', 'Reminders approved and sent', 'Collections', list.length + ' reminders', 'One approval on the Credit Desk');
    toast(list.length + ' reminders approved and sent (demo: nothing leaves this page).'); render(); return;
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'draft') S.edits[e.target.dataset.id] = e.target.value;
  if (S.form && e.target.id === 'f-reason') S.form.reason = e.target.value;
  if (S.form && e.target.id === 'f-amount') S.form.amount = e.target.value;
  if (S.form && e.target.id === 'f-date') S.form.date = e.target.value;
});

document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target, act = f.dataset.act, id = f.dataset.id;
  const reason = (S.form.reason || '').trim();
  if (act === 'submitDecision') {
    const a = S.apps.find((x) => x.id === id);
    if (!reason) { S.form.error = 'Add a reason. It goes into the audit log.'; render(); return; }
    if (S.form.kind === 'different') {
      const amt = Math.round(Number(S.form.amount) * L);
      if (!(amt > 0)) { S.form.error = 'Enter an amount in lakh, for example 20 for ₹20 L.'; render(); return; }
      if (C.approverFor({ kind: 'limit', amount: amt }) === 'cfo' && S.role !== 'cfo') { S.form.error = 'Above ₹50 L needs the CFO. Enter ₹50 L or less, or ask Anita Kapoor.'; render(); return; }
      S.form = null; approveApp(a, amt, reason); render(); return;
    }
    a.status = S.form.kind === 'decline' ? 'declined' : 'returned';
    a.decision = { by: me().name, role: S.role, amount: 0, reason, at: new Date().toISOString() };
    log(me().name, 'person', S.form.kind === 'decline' ? 'Declined' : 'Sent back', a.id, reason, 'Credit Desk · flow 2');
    toast(S.form.kind === 'decline' ? 'Declined. Sales and the analyst have been told.' : 'Sent back to ' + PEOPLE.analyst.name + '.');
    S.form = null; render(); return;
  }
  if (act === 'submitRelease') {
    if (!reason) { S.form.error = 'A reason is required to release a held order.'; render(); return; }
    S.orders[id] = { status: 'released_by_approver', by: me().name, reason };
    log(me().name, 'person', 'Order released once', id, reason, 'Release form · flow 3');
    S.form = null; toast('Order ' + id + ' released once. Sales has been told.'); render(); return;
  }
  if (act === 'submitPromise') {
    const amt = Math.round(Number(S.form.amount) * L);
    if (!(amt > 0) || !S.form.date) { S.form.error = 'Enter the amount and the date they promised.'; render(); return; }
    S.chase[id] = { status: 'promise', by: me().name, amount: amt, date: S.form.date };
    log(me().name, 'person', 'Promise to pay logged', id, lakh(amt) + ' by ' + fmtDate(S.form.date), 'Phone call');
    S.form = null; toast('Promise logged. Tomorrow\'s run will check it against payments.'); render(); return;
  }
});

const fromHash = () => { const h = location.hash.slice(1); if (VIEWS.some(([k]) => k === h)) S.view = h; };
window.addEventListener('hashchange', () => { fromHash(); S.form = null; render(); });
fromHash();
render();
</script>

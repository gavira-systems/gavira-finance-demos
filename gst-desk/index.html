<style>

/* Layout: a working desk — header with role switch, tab bar, then list-and-detail panes. Gold marks only buttons where a person decides. */
:root {
  --bg: #f3f5f1; --surface: #ffffff; --surface-2: #eef2ee; --line: #d9e1db; --line-2: #c6d0c9;
  --ink: #111a19; --ink-2: #45524f; --ink-3: #66746f;
  --teal: #006d77; --teal-ink: #005c65; --teal-soft: #e0eeee; --on-teal: #ffffff;
  --sage: #899670; --sage-soft: #a3b18a;
  --gold: #ffd166; --gold-ink: #2b2100; --gold-line: #e9b53a;
  --good: #2e7744; --good-soft: #e2f0e5; --warn: #8f5600; --warn-soft: #f7ead3; --bad: #a93224; --bad-soft: #f7e0dc;
  --age0: #a3b18a; --age1: #6fa6ab; --age2: #e0ad45; --age3: #d4774e; --age4: #a93224;
  --shadow: 0 1px 2px rgb(17 26 25 / .06), 0 4px 16px rgb(17 26 25 / .05);
  --f-display: 'Playfair Display', Georgia, serif;
  --f-body: 'Lato', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1517; --surface: #101e21; --surface-2: #162a2e; --line: #22383c; --line-2: #2d4549;
  --ink: #f1f4ee; --ink-2: #b9c6c3; --ink-3: #8c9fa1;
  --teal: #0c7c86; --teal-ink: #5cc4cb; --teal-soft: #12353a; --on-teal: #ffffff;
  --good: #7cc493; --good-soft: #163128; --warn: #e6ad55; --warn-soft: #33290f; --bad: #f08c7e; --bad-soft: #3a1d19;
  --age0: #7f8c69; --age1: #4f8f95; --age2: #c9973a; --age3: #c86b44; --age4: #d65a48;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .25);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0b1517; --surface: #101e21; --surface-2: #162a2e; --line: #22383c; --line-2: #2d4549;
  --ink: #f1f4ee; --ink-2: #b9c6c3; --ink-3: #8c9fa1;
  --teal: #0c7c86; --teal-ink: #5cc4cb; --teal-soft: #12353a; --on-teal: #ffffff;
  --good: #7cc493; --good-soft: #163128; --warn: #e6ad55; --warn-soft: #33290f; --bad: #f08c7e; --bad-soft: #3a1d19;
  --age0: #7f8c69; --age1: #4f8f95; --age2: #c9973a; --age3: #c86b44; --age4: #d65a48;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1240px; margin: 0 auto; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal-ink); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }

.demo { margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 8px max(16px, env(safe-area-inset-left, 0px)); background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); text-align: center; }
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 18px 14px; }

.roles button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; cursor: pointer; text-align: left; line-height: 1.25; }
.roles button span { display: block; font-size: 11px; color: var(--ink-3); }
.roles button[aria-pressed="true"] { background: var(--surface); box-shadow: var(--shadow); }
.roles .as { align-self: center; padding: 0 6px 0 8px; font-size: 11.5px; color: var(--ink-3); }
nav.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }

main { padding-top: 22px; display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }

.pagehead h2 { font-family: var(--f-display); font-weight: 600; font-size: 24px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }

.legend { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.legend div { display: grid; gap: 2px; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }

.list { display: grid; }
.row { display: grid; gap: 4px; padding: 12px 16px; border-top: 1px solid var(--line); text-align: left; background: transparent; border-left: 3px solid transparent; border-right: 0; border-bottom: 0; cursor: pointer; width: 100%; }
.row:first-child { border-top: 0; }

.row .name { font-weight: 700; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }

.grade { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; font-weight: 900; font-size: 13px; }
.grade.A { background: var(--good-soft); color: var(--good); } .grade.B { background: var(--teal-soft); color: var(--teal-ink); }
.grade.C { background: var(--warn-soft); color: var(--warn); } .grade.D { background: var(--bad-soft); color: var(--bad); }

.btn { border: 1px solid var(--line-2); background: var(--surface); padding: 9px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { background: var(--surface-2); }

.btn.gold:hover { filter: brightness(.97); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.gate { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 8px; background: var(--surface-2); color: var(--ink-2); font-size: 13.5px; }

.detail { display: grid; gap: 18px; padding: 20px 22px; }
.dhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: start; }
.dhead h3 { font-size: 20px; font-weight: 900; }
.amounts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.amounts div { padding: 12px 14px; display: grid; gap: 2px; border-left: 1px solid var(--line); }

.amounts .hl { background: var(--teal-soft); }
.steps { display: flex; flex-wrap: wrap; gap: 6px 4px; list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
.steps li { display: flex; align-items: center; gap: 6px; color: var(--ink-3); }
.steps li::after { content: ''; width: 18px; height: 1px; background: var(--line-2); margin-left: 4px; }

.steps .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); }
.steps .done .dot { background: var(--sage); }

table { border-collapse: collapse; width: 100%; }
.tablewrap { overflow-x: auto; }
th { text-align: left; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.pts { font-family: var(--f-mono); font-weight: 500; }
.pts.pos { color: var(--good); } .pts.neg { color: var(--bad); }
.src { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.ceil { display: grid; gap: 6px; font-size: 13.5px; }
.ceil div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 10px; border-radius: 6px; }
.ceil .bind { background: var(--teal-soft); font-weight: 700; }
.note { white-space: pre-wrap; font-size: 13.5px; line-height: 1.55; background: var(--surface-2); padding: 14px 16px; border-radius: 8px; border: 1px solid var(--line); }
.usage { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); min-width: 90px; overflow: hidden; }
.usage span { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
.usage::after { content: ''; position: absolute; top: -2px; bottom: -2px; left: calc(100% / 1.2); width: 2px; background: var(--ink-3); opacity: .5; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.form { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface-2); }
.form label { display: grid; gap: 4px; font-size: 13px; font-weight: 700; }
.form input, .form textarea { border: 1px solid var(--line-2); background: var(--surface); border-radius: 6px; padding: 8px 10px; font-weight: 400; }
.form .err { color: var(--bad); font-size: 13px; }
textarea.draft { width: 100%; min-height: 180px; border: 1px solid var(--line-2); border-radius: 8px; padding: 12px 14px; background: var(--surface); line-height: 1.55; resize: vertical; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--teal-soft); color: var(--teal-ink); font-weight: 700; }
.wa { background: #e7f1e4; color: #0b141a; border-radius: 10px; padding: 14px; display: grid; gap: 8px; }
.wa .bubble { background: #ffffff; border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; font-size: 14px; box-shadow: 0 1px 1px rgb(0 0 0 / .08); max-width: 520px; }
.wa .meta { font-size: 11.5px; color: #54656f; }

.decide { display: grid; gap: 2px; }
.decide a { display: flex; justify-content: space-between; gap: 12px; padding: 12px 4px; border-top: 1px solid var(--line); text-decoration: none; color: inherit; align-items: center; }
.decide a:first-child { border-top: 0; }
.decide a:hover .go { text-decoration: underline; }
.decide .go { color: var(--teal-ink); font-weight: 700; font-size: 13px; white-space: nowrap; }
.guide { border-color: var(--gold-line); }
.guide ol { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; }
.guide a { color: var(--teal-ink); font-weight: 700; }
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.how div { padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); display: grid; gap: 6px; align-content: start; }
.how div.person { border-color: var(--gold-line); background: color-mix(in srgb, var(--gold) 14%, var(--surface)); }
.how b { font-size: 15px; }
.spark { width: 100%; height: 64px; display: block; }
.months { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-3); margin-top: 4px; }
.months span { display: grid; justify-items: center; gap: 1px; }
.months b { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.conn td:first-child { font-weight: 700; }
.ok { color: var(--good); font-weight: 700; } .cfg { color: var(--warn); font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); z-index: 20; max-width: min(560px, calc(100vw - 32px)); }
.legend-gold { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-3); }
.legend-gold i { width: 12px; height: 12px; border-radius: 3px; background: var(--gold); border: 1px solid var(--gold-line); }
.empty { padding: 28px; text-align: center; color: var(--ink-3); }
@media (max-width: 980px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid2, .split { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) { .roles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; } .roles .as { grid-column: 1 / -1; padding: 2px 6px; } .roles button { padding: 6px 8px; font-size: 13.5px; } .legend { grid-template-columns: repeat(2, minmax(0, 1fr)); } .how { grid-template-columns: minmax(0, 1fr); } .amounts { grid-template-columns: minmax(0, 1fr); } .amounts div { border-left: 0; border-top: 1px solid var(--line); } .amounts div:first-child { border-top: 0; } .brand h1 { font-size: 22px; } .detail { padding: 16px; } }
@media (prefers-reduced-motion: no-preference) { .row, .btn, nav.tabs a { transition: background-color .15s, border-color .15s, filter .15s; } }

/* GST Desk additions: two roles, the ITC split bar, the month's steps and the sign-off sheet. */
@media (max-width: 560px) { .roles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.split3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

.month { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }

.month li:first-child { border-top: 0; }
.month .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line-2); justify-self: center; }
.month .done .dot { background: var(--sage); }
.month .now .dot { background: var(--gold); box-shadow: 0 0 0 3px rgb(255 209 102 / .35); }
.month .now { font-weight: 700; }
.month .when { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.sheet { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.sheet div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 14px; }

<script>
// Reading amounts and dates as Indian ledgers and Excel exports write them.
(function (root) {
  const MONTHS = { JAN: 1, FEB: 2, MAR: 3, APR: 4, MAY: 5, JUN: 6, JUL: 7, AUG: 8, SEP: 9, OCT: 10, NOV: 11, DEC: 12 };

  function parseAmount(v) {
    if (typeof v === 'number') return v;
    let s = String(v == null ? '' : v).trim();
    const negative = /^\(.*\)$/.test(s) || /^-/.test(s);
    s = s.replace(/[()₹\s-]/g, '').replace(/^Rs\.?/i, '');
    let mult = 1;
    if (/cr(ore)?s?$/i.test(s)) { mult = 1e7; s = s.replace(/cr(ore)?s?$/i, ''); }
    else if (/(l|lakh|lakhs|lac|lacs)$/i.test(s)) { mult = 1e5; s = s.replace(/(lakhs|lakh|lacs|lac|l)$/i, ''); }
    const n = Number(s.replace(/,/g, ''));
    if (!Number.isFinite(n)) return NaN;
    return Math.round(n * mult * 100) / 100 * (negative ? -1 : 1);
  }

  function iso(y, m, d) {
    const dt = new Date(Date.UTC(y, m - 1, d));
    if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return null;
    return dt.toISOString().slice(0, 10);
  }

  // Excel serial 25569 = 1970-01-01.
  function fromSerial(n) {
    return new Date(Math.round((n - 25569) * 86400000)).toISOString().slice(0, 10);
  }

  function parseDate(v) {
    if (typeof v === 'number') return fromSerial(v);
    const s = String(v == null ? '' : v).trim();
    if (/^\d{5}(\.\d+)?$/.test(s)) return fromSerial(Number(s));
    let m;
    if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return iso(+m[1], +m[2], +m[3]);

    notIn2b: 'Ask the supplier to report this invoice in GSTR-1. No credit until it appears in GSTR-2B.',
    notInBooks: 'Check with stores: book the purchase if the goods or service came in, otherwise reject in IMS.',
    wrongGstin: 'Correct the supplier GSTIN in the books: the supplier billed from another state registration.',

const SUP = Object.fromEntries(DATA.suppliers.map((s) => [s.gstin, s]));
const TWO_B = Object.fromEntries(DATA.gstr2b.map((t) => [t.gstin + '|' + t.invoiceNo, t]));
const FOLLOW = R.bySupplier.filter((s) => s.needsSupplier).map((s) => {
  const f = C.followUp(s.supplierName, s.rows, P.label);
  const c = SUP[s.gstin] || {};
  return { gstin: s.gstin, name: s.supplierName, contact: c.contact, email: c.email, onTime: c.gstOnTime12, rows: s.rows.filter((r) => CAT[r.category].owner === 'supplier'), ...f };
});

const S = { role: 'exec', view: 'summary', guide: true, filter: 'open', selSup: FOLLOW[0].gstin, edits: {}, done: {}, sent: {}, signoff: null, form: null, auditFilter: 'all', audit: [] };
try { const r = localStorage.getItem('gstDeskRole'); if (r && ROLE_LABEL[r]) S.role = r; if (localStorage.getItem('gstDeskGuide') === 'hidden') S.guide = false; } catch (e) {}

const me = () => PEOPLE[S.role];
const ours = () => ROWS.filter((r) => CAT[r.category].owner === 'us');
const ourOpen = () => ours().filter((r) => !S.done[r.id]);
const unsent = () => FOLLOW.filter((f) => !S.sent[f.gstin]);

// Claimable now: everything the rules allow, plus credit unlocked by fixing our own books.
function claimLines() {
  const lines = [];
  for (const r of ROWS) {
    let c = r.claimable;
    if (r.category === 'wrongGstin' && S.done[r.id]) c = r.tax2b;
    if (r.category === 'notInBooks' && S.done[r.id] && S.done[r.id].how === 'booked') c = r.tax2b;
    if (c > 0) lines.push({ r, c });
  }
  return lines;
}
function claimNow() { return Math.round(claimLines().reduce((s, l) => s + l.c, 0) * 100) / 100; }
function heads() {
  const h = { igst: 0, cgst: 0, sgst: 0 };
  for (const { r, c } of claimLines()) {
    const t = TWO_B[r.gstin2b + '|' + r.invoiceNo2b];
    const f = c / r.tax2b;
    h.igst += (t.igst || 0) * f; h.cgst += (t.cgst || 0) * f; h.sgst += (t.sgst || 0) * f;
  }
  return h;
}
const fixFirst = () => ROWS.filter((r) => r.category === 'wrongGstin' && !S.done[r.id]).reduce((s, r) => s + r.tax2b, 0);

// Actions happen on the demo date, at the viewer's current time in IST.
const stamp = () => TODAY + 'T' + new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(11, 19) + '+05:30';
function log(actor, actorType, action, record, detail, evidence, at) {
  S.audit.unshift({ at: at || stamp(), actor, actorType, action, record, detail, evidence });
}
(function seedAudit() {
  const t = (m) => '2026-10-15T09:' + String(m).padStart(2, '0') + ':00+05:30';
  const c = R.summary.counts;
  [
    [t(0), 'GST flow', 'system', 'GSTR-2B fetched', P.label, R.summary.invoices2b + ' invoices from ' + new Set(DATA.gstr2b.map((x) => x.gstin)).size + ' supplier registrations', 'GSP (sample response) · run on the 15th'],
    [t(0), 'GST flow', 'system', 'Purchase register read', P.label, DATA.books.length + ' bills', 'Tally purchase register (CSV in demo)'],
    [t(1), 'Matching rules', 'system', 'Matched invoice by invoice', P.label, c.matched + ' matched, ' + (ROWS.length - c.matched) + ' to fix · ' + lakh(R.summary.claimable) + ' claimable, ' + lakh(R.summary.atRisk) + ' held up', 'Rules v2026-10 · Section 16(2)(aa)'],
    [t(1), 'GST flow', 'system', 'Worklist written', P.label, (ROWS.length - c.matched) + ' rows', 'GST worklist tab'],
    [t(1), 'GST flow', 'system', 'Supplier emails drafted', P.label, FOLLOW.length + ' drafts, ' + lakh(FOLLOW.reduce((s, f) => s + f.held, 0)) + ' held up', 'Follow-up templates'],
    [t(2), 'GST flow', 'system', 'Approval requested', P.label, 'Sent to ' + PEOPLE.fc.name, 'Gmail'],
  ].reverse().forEach((r) => S.audit.push({ at: r[0], actor: r[1], actorType: r[2], action: r[3], record: r[4], detail: r[5], evidence: r[6] }));
})();

function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 4200); }
const chip = (cat) => `<span class="chip ${CAT[cat].tone}">${CAT[cat].label}</span>`;

function waiting() {
  const items = [];
  if (S.role === 'exec') {
    if (ourOpen().length) items.push(['worklist', 'Fix ' + ourOpen().length + ' items in our books', 'Duplicate, wrong GSTIN, bills not booked']);
    else if (!S.signoff) items.push(['signoff', 'Send ' + lakh(claimNow()) + ' to ' + PEOPLE.fc.name + ' for sign-off', 'The worklist is clear']);
  } else {
    if (unsent().length) items.push(['suppliers', 'Approve ' + unsent().length + ' supplier emails', lakh(unsent().reduce((s, f) => s + f.held, 0)) + ' of credit held up']);
    if (S.signoff && !S.signoff.signedBy) items.push(['signoff', 'Sign off ' + lakh(S.signoff.amount) + ' for GSTR-3B', 'Prepared by ' + S.signoff.preparedBy]);
  }
  return items;
}

function viewWorklist() {
  const filters = [['open', 'Ours, open'], ['ours', 'Ours'], ['supplier', "Supplier's"], ['all', 'All to fix'], ['matched', 'Matched']];
  const f = S.filter;
  const shown = ROWS.filter((r) => {
    const o = CAT[r.category].owner;
    if (f === 'matched') return r.category === 'matched';
    if (r.category === 'matched') return false;
    if (f === 'open') return o === 'us' && !S.done[r.id];
    if (f === 'ours') return o === 'us';
    if (f === 'supplier') return o === 'supplier';
    return true;
  });
  const canFix = S.role === 'exec';
  return `
  <div class="pagehead"><h2>Worklist</h2><span class="muted small">${ROWS.length - R.summary.counts.matched} invoices to fix · written to the GST worklist tab by the 15 Oct run</span></div>
  <section class="panel">
    <div class="pad pagehead"><span class="small">${ourOpen().length ? `<b>${ourOpen().length} of ${ours().length}</b> of our items still open.` : '<b>Our side is clear.</b> What remains is with suppliers.'}${canFix ? '' : ' ' + esc(PEOPLE.exec.name) + ' fixes our side; you see it as she goes.'}</span>
      <div class="filters" role="group" aria-label="Filter worklist">${filters.map(([k, l]) => `<button aria-pressed="${f === k}" data-act="filter" data-k="${k}">${l}</button>`).join('')}</div></div>

      <tbody>${shown.map((r) => worklistRow(r, canFix)).join('') || `<tr><td colspan="6" class="empty">${f === 'open' ? 'Nothing open on our side.' : 'Nothing here.'}</td></tr>`}</tbody>
    </table></div>
  </section>`;
}

function worklistRow(r, canFix) {
  const cat = CAT[r.category];
  const inv = r.invoiceNo || r.invoiceNo2b;
  const other = r.invoiceNo && r.invoiceNo2b && r.invoiceNo2b !== r.invoiceNo ? `<span class="inv2">In 2B as ${esc(r.invoiceNo2b)}</span>` : r.gstin2b && r.gstin2b !== r.gstin ? `<span class="inv2">In 2B under ${esc(r.gstin2b)}</span>` : !r.invoiceNo ? '<span class="inv2">Only in GSTR-2B</span>' : '';
  let todo;
  if (r.category === 'matched') todo = '<span class="muted small">Claim in GSTR-3B</span>';
  else if (cat.owner === 'supplier') {
    const s = S.sent[r.gstin];
    todo = `<span class="small">${esc(r.action)}</span>${s ? `<span class="src">Email sent by ${esc(s.by)}</span>` : `<span class="src">Email drafted, waiting for ${esc(PEOPLE.fc.name)}</span>`}`;
  } else if (S.done[r.id]) {
    todo = `<span class="chip good">✓ ${DONE_TEXT[S.done[r.id].how]}</span><span class="src">${esc(S.done[r.id].by)}${canFix && !(S.signoff && S.signoff.signedBy) ? ` · <button class="btn link" data-act="undoFix" data-id="${esc(r.id)}">Undo</button>` : ''}</span>`;
  } else {
    todo = `<span class="small">${esc(r.action)}</span>${canFix ? `<div class="rowacts" style="margin-top:6px">${cat.done.map(([how, l], i) => `<button class="btn ${i ? '' : 'teal'}" data-act="fix" data-id="${esc(r.id)}" data-how="${how}">${l}</button>`).join('')}</div>` : ''}`;
  }
  return `<tr>
    <td><b>${esc(r.supplierName)}</b><span class="src num">${esc(inv)} · ${fmtDate(r.date)}</span>${other}</td>
    <td class="r num">${r.taxBooks ? inr(r.taxBooks) : '—'}</td><td class="r num">${r.tax2b ? inr(r.tax2b) : '—'}</td>
    <td class="r num">${r.itcAtRisk ? inr(r.itcAtRisk) : '—'}</td>
    <td>${chip(r.category)}${r.reason ? `<span class="src">${esc(r.reason)}</span>` : ''}</td>
    <td style="min-width:240px">${todo}</td>
  </tr>`;
}

function supplierDetail(f, canSend) {
  const sent = S.sent[f.gstin];
  const text = S.edits[f.gstin] ?? f.message;

  const act = sent
    ? `<div class="gate">Sent by ${esc(sent.by)}${sent.edited ? ' (edited)' : ''} · logged</div>`
    : `<div class="actions">${canSend ? `<button class="btn gold" data-act="sendOne" data-id="${f.gstin}">Approve and send</button>` : ''}${edited ? '<span class="chip teal">Edited</span>' : ''}${!canSend ? `<span class="muted small">Edits are kept for ${esc(PEOPLE.fc.name)} to approve.</span>` : ''}</div>`;
  return `<div class="detail">
    <div class="dhead"><div><span class="label">${esc(f.gstin)} · filed on time ${f.onTime} of 12 months</span><h3>${esc(f.name)}</h3></div><span class="chip bad num">${amt(f.held)} held up</span></div>
    <div><label class="label" for="draft">Email to ${esc(f.contact)} · ${esc(f.email)}</label><p class="small" style="margin:6px 0"><b>Subject:</b> ${esc(f.subject)}</p><textarea class="draft" id="draft" data-id="${f.gstin}" ${sent ? 'readonly' : ''}>${esc(text)}</textarea></div>

    <section><h4 class="label" style="margin-bottom:8px">Invoices that need this supplier</h4><div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Date</th><th class="r">Tax</th><th class="r">Held up</th><th>Found</th></tr></thead><tbody>${f.rows.map((r) => `<tr><td class="num">${esc(r.invoiceNo)}</td><td>${fmtDate(r.date)}</td><td class="r num">${inr(r.taxBooks)}</td><td class="r num">${inr(r.itcAtRisk)}</td><td>${chip(r.category)}</td></tr>`).join('')}</tbody></table></div></section>

}

function viewSignoff() {
  const h = heads(), cn = claimNow(), so = S.signoff, open = ourOpen();
  const checks = [
    [!open.length, open.length ? open.length + ' of our worklist items still open' : 'Our side of the worklist is clear'],
    [true, 'Only invoices in GSTR-2B are counted (Section 16(2)(aa))'],
    [true, 'Amount differences counted at the lower figure; blocked credit left out'],
    [!unsent().length, unsent().length ? unsent().length + ' supplier emails not yet approved' : 'Every supplier who must act has been emailed'],
  ];
  let act;
  if (so && so.signedBy) act = `<div class="gate">Signed off by ${esc(so.signedBy)} · ${new Date(so.signedAt).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Kolkata' })} · <span class="num">${inr(so.amount)}</span>. The figure is locked for GSTR-3B; your team files it on the portal.</div>`;
  else if (S.role === 'exec') {
    if (so) act = `<div class="gate">Sent to ${esc(PEOPLE.fc.name)} for sign-off at <span class="num">${inr(so.amount)}</span>. You prepared it, so you cannot sign it.</div>`;
    else if (open.length) act = `<div class="gate">Fix the ${open.length} open items on the <a href="#worklist" data-act="goto" data-view="worklist">worklist</a> first. The figure changes as you do.</div>`;
    else act = `<div class="actions"><button class="btn teal" data-act="prepare">Send ${inr(cn)} to ${esc(PEOPLE.fc.name)} for sign-off</button></div>`;
  } else {
    if (!so) act = `<div class="gate">Waiting for ${esc(PEOPLE.exec.name)} to clear the worklist and prepare the figure.</div>`;
    else if (S.form && S.form.kind === 'sendback') act = `<form class="form" data-act="submitSendback"><b>Send back to ${esc(PEOPLE.exec.name)}</b><label>Reason (goes into the audit log)<textarea id="f-reason" rows="2" placeholder="Required">${esc(S.form.reason || '')}</textarea></label>${S.form.error ? `<span class="err">${esc(S.form.error)}</span>` : ''}<div class="actions"><button class="btn teal" type="submit">Send back</button><button class="btn link" type="button" data-act="closeForm">Cancel</button></div></form>`;
    else act = `<div class="actions"><button class="btn gold" data-act="sign">Sign off ${inr(so.amount)}</button><button class="btn link" data-act="openSendback">Send back</button><span class="muted small">Prepared by ${esc(so.preparedBy)}</span></div>`;
  }
  return `
  <div class="pagehead"><h2>Sign-off</h2><span class="muted small">The input tax credit Sarvam claims for ${esc(P.label)} · GSTR-3B due ${fmtDate(P.gstr3bDue)}</span></div>
  <div class="grid2">
    <section class="panel pad" style="display:grid;gap:16px">
      <div class="pagehead"><h3 class="label">ITC to claim · GSTR-3B table 4(A)(5), all other ITC</h3>${so && so.signedBy ? '<span class="chip good">Signed</span>' : so ? '<span class="chip warn">Awaiting sign-off</span>' : '<span class="chip">Being prepared</span>'}</div>
      <div class="sheet">
        <div><span>Integrated tax (IGST)</span><span class="num">${inr(h.igst)}</span></div>
        <div><span>Central tax (CGST)</span><span class="num">${inr(h.cgst)}</span></div>
        <div><span>State tax (SGST)</span><span class="num">${inr(h.sgst)}</span></div>
        <div><span>Cess</span><span class="num">₹0</span></div>
        <div class="total"><span>Total to claim</span><span class="num">${inr(so ? so.amount : cn)}</span></div>
      </div>
      ${so && !so.signedBy && Math.abs(so.amount - cn) > 0.5 ? `<div class="gate">The figure changed after it was prepared. ${esc(PEOPLE.exec.name)} must send it again.</div>` : ''}
      ${act}
    </section>
    <section class="panel pad">
      <h3 class="label" style="margin-bottom:12px">Before signing</h3>
      <ul class="checks">${checks.map(([ok, t]) => `<li><span class="${ok ? 'y' : 'n'}">${ok ? '✓' : '!'}</span><span>${esc(t)}</span></li>`).join('')}</ul>
      <p class="muted small" style="margin-top:14px">Held up and not claimed this month: <span class="num">${inr(R.summary.atRisk)}</span>. It can be claimed in a later month once the supplier reports it, within the time limit in Section 16(4).</p>
    </section>
  </div>`;
}

function viewAudit() {
  const f = S.auditFilter;
  const rows = S.audit.filter((r) => f === 'all' || (f === 'people' ? r.actorType === 'person' : r.actorType !== 'person'));
  return `
  <div class="pagehead"><h2>Audit log</h2><span class="muted small">Every step, who or what did it, and the evidence · ${S.audit.length} entries</span></div>
  <section class="panel">
    <div class="pad pagehead"><span class="muted small">Newest first. In a live install this is the n8n audit table, kept with you.</span><div class="filters" role="group" aria-label="Filter log">${[['all', 'All'], ['people', 'People'], ['machine', 'System']].map(([k, l]) => `<button aria-pressed="${f === k}" data-act="auditFilter" data-k="${k}">${l}</button>`).join('')}</div></div>
    <div class="tablewrap"><table>
      <thead><tr><th>When</th><th>Who</th><th>What</th><th>Record</th><th>Detail and evidence</th></tr></thead>
      <tbody>${rows.map((r) => `<tr><td class="num small" style="white-space:nowrap">${new Date(r.at).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Kolkata' })}</td><td><b>${esc(r.actor)}</b><span class="src">${r.actorType === 'person' ? 'Person' : 'System'}</span></td><td>${esc(r.action)}</td><td class="num small">${esc(r.record)}</td><td class="small">${esc(r.detail)}<span class="src">${esc(r.evidence)}</span></td></tr>`).join('')}</tbody>
    </table></div>
  </section>`;
}

function viewConnections() {
  const rows = [
    ['Purchase register upload (CSV or Excel)', 'Live in demo', 'Bills from any ledger; columns matched by name', 'Nothing', 'Nothing'],
    ['GSTR-2B upload (portal download)', 'Live in demo', 'Invoices suppliers reported, ITC availability', 'Nothing: download from the GST portal and drop it in', 'Nothing'],
    ['Google Sheet', 'Live in demo', 'Supplier contacts', 'Nothing', 'The GST worklist'],
    ['Gmail or Microsoft 365', 'Live in demo', 'The controller\'s approval', 'A mailbox the flow can send from', 'Supplier follow-ups, the approval email'],
    ['GST data via a GSP', 'Configured', 'GSTR-2B on the 15th; supplier filing record', 'A GST Suvidha Provider account and taxpayer API access', 'IMS accept, reject or pending, only if you switch it on'],
    ['TallyPrime', 'Configured', 'Purchase register (XML on port 9000)', 'A small agent inside your network; the Tally port is never exposed', 'Nothing'],
    ['Zoho Books', 'Configured', 'Bills (REST API, India data centre)', 'An API connection and the organisation ID', 'Nothing'],
    ['SAP S/4HANA or Business One', 'Configured', 'Supplier invoices (OData / Service Layer)', 'An API user with read access', 'Nothing'],
  ];
  return `
  <div class="pagehead"><h2>Connections</h2><span class="muted small">What this desk reads, what it writes back, and what we need from your IT team</span></div>
  <section class="panel"><div class="tablewrap"><table class="conn">
    <thead><tr><th>System</th><th>Status</th><th>What we read</th><th>What we write back</th><th>What we need from you</th></tr></thead>
    <tbody>${rows.map(([n, s, r, need, w]) => `<tr><td>${n}</td><td class="${s === 'Live in demo' ? 'ok' : 'cfg'} small">${s}</td><td class="small">${r}</td><td class="small">${w}</td><td class="small">${need}</td></tr>`).join('')}</tbody>
  </table></div></section>
  <div class="grid2">
    <section class="panel pad"><h3 class="label" style="margin-bottom:10px">How it runs</h3>
      <div class="ceil">
        <div><span>1 · Fetch</span><span class="muted">15th, 09:00 → GSTR-2B and purchase register</span></div>
        <div><span>2 · Match</span><span class="muted">invoice by invoice → 9 outcomes</span></div>
        <div><span>3 · Worklist</span><span class="muted">every difference → sheet, with the action</span></div>
        <div><span>4 · Suppliers</span><span class="muted">one approval → one email per supplier</span></div>
        <div><span>5 · Sign-off</span><span class="muted">executive prepares → controller signs</span></div>
      </div>
      <p class="muted small" style="margin-top:10px">One n8n workflow: visual, readable by your IT team, and running in your own cloud account.</p>
    </section>
    <section class="panel pad"><h3 class="label" style="margin-bottom:10px">Controls</h3>
      <ul class="small" style="margin:0;padding-left:18px;display:grid;gap:6px">
        <li>Credit is counted only for invoices in GSTR-2B. The rule is in code and tested every release.</li>
        <li>Matching is rules, not AI: the same files give the same answer, every month.</li>
        <li>The accounts executive prepares the figure; the finance controller signs it. The preparer never signs.</li>
        <li>No email reaches a supplier without the controller's approval. Every email is logged.</li>
        <li>We prepare the figure. Filing GSTR-3B stays with your team or your GST practitioner.</li>
      </ul>
    </section>
  </div>`;
}

// ---------- render ----------
function render() {
  document.getElementById('roles').innerHTML = '<span class="as">Viewing as</span>' + ['exec', 'fc'].map((r) => `<button aria-pressed="${S.role === r}" data-act="role" data-role="${r}">${esc(PEOPLE[r].name)}<span>${ROLE_LABEL[r]}</span></button>`).join('');
  const counts = { worklist: S.role === 'exec' ? ourOpen().length : 0, suppliers: S.role === 'fc' ? unsent().length : 0, signoff: waiting().some(([v]) => v === 'signoff') ? 1 : 0 };
  document.getElementById('tabs').innerHTML = VIEWS.map(([k, l]) => `<a href="#${k}" data-act="goto" data-view="${k}" ${S.view === k ? 'aria-current="page"' : ''}>${l}${counts[k] ? `<span class="count num">${counts[k]}</span>` : ''}</a>`).join('');
  const v = { summary: viewSummary, worklist: viewWorklist, suppliers: viewSuppliers, signoff: viewSignoff, audit: viewAudit, connections: viewConnections }[S.view];
  document.getElementById('main').innerHTML = v();
}

// ---------- actions ----------
function sendFollowUp(f) {
  const edited = S.edits[f.gstin] != null && S.edits[f.gstin] !== f.message;
  S.sent[f.gstin] = { by: me().name, edited };
  log(me().name, 'person', 'Supplier email sent', f.name, f.subject + ' · ' + inr(f.held) + ' held up' + (edited ? ' (edited)' : ''), 'Approved on the GST Desk');
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t || t.tagName === 'FORM') return;
  const act = t.dataset.act, id = t.dataset.id;
  if (act === 'goto') { e.preventDefault(); S.view = t.dataset.view; S.form = null; history.replaceState(null, '', '#' + S.view); render(); window.scrollTo({ top: 0 }); return; }
  if (act === 'role') { S.role = t.dataset.role; S.form = null; try { localStorage.setItem('gstDeskRole', S.role); } catch (err) {} render(); return; }
  if (act === 'filter') { S.filter = t.dataset.k; render(); return; }
  if (act === 'auditFilter') { S.auditFilter = t.dataset.k; render(); return; }
  if (act === 'selSup') { S.selSup = id; render(); return; }
  if (act === 'hideGuide') { S.guide = false; try { localStorage.setItem('gstDeskGuide', 'hidden'); } catch (err) {} render(); return; }
  if (act === 'restart') { try { localStorage.removeItem('gstDeskRole'); localStorage.removeItem('gstDeskGuide'); } catch (err) {} location.hash = 'summary'; location.reload(); return; }
  if (act === 'closeForm') { S.form = null; render(); return; }
  if (act === 'fix') {
    const r = ROWS.find((x) => x.id === id);
    S.done[id] = { how: t.dataset.how, by: me().name };
    if (S.signoff && !S.signoff.signedBy) S.signoff = null;
    log(me().name, 'person', DONE_TEXT[t.dataset.how], r.invoiceNo || r.invoiceNo2b, r.supplierName + ' · ' + CAT[r.category].label, 'GST worklist');
    toast(DONE_TEXT[t.dataset.how] + ': ' + r.supplierName + '. ' + (ourOpen().length ? ourOpen().length + ' of our items left.' : 'Our side is clear. Prepare the figure on Sign-off.'));
    render(); return;
  }
  if (act === 'undoFix') {
    const r = ROWS.find((x) => x.id === id);
    delete S.done[id];
    if (S.signoff && !S.signoff.signedBy) S.signoff = null;
    log(me().name, 'person', 'Undone', r.invoiceNo || r.invoiceNo2b, r.supplierName + ' · back on the worklist', 'GST worklist');
    toast('Back on the worklist: ' + r.supplierName + '.'); render(); return;
  }
  if (act === 'sendOne') { const f = FOLLOW.find((x) => x.gstin === id); sendFollowUp(f); toast('Email to ' + f.name + ' approved and sent (demo: nothing leaves this page).'); render(); return; }
  if (act === 'sendAll') {
    const list = unsent();
    list.forEach(sendFollowUp);
    toast(list.length + ' supplier emails approved and sent (demo: nothing leaves this page).'); render(); return;
  }
  if (act === 'prepare') {
    S.signoff = { preparedBy: me().name, amount: claimNow() };
    log(me().name, 'person', 'Sent for sign-off', P.label, 'ITC ' + inr(S.signoff.amount) + ' for GSTR-3B', 'Sent to ' + PEOPLE.fc.name);
    toast('Sent to ' + PEOPLE.fc.name + ' for sign-off.'); render(); return;
  }
  if (act === 'sign') {
    S.signoff.signedBy = me().name; S.signoff.signedAt = stamp();
    log(me().name, 'person', 'ITC signed off', P.label, inr(S.signoff.amount) + ' for GSTR-3B, prepared by ' + S.signoff.preparedBy, 'Sign-off button · GST Desk');
    toast('Signed off ' + inr(S.signoff.amount) + '. Locked for GSTR-3B.'); render(); return;
  }
  if (act === 'openSendback') { S.form = { kind: 'sendback' }; render(); document.getElementById('f-reason')?.focus(); return; }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'draft') S.edits[e.target.dataset.id] = e.target.value;
  if (S.form && e.target.id === 'f-reason') S.form.reason = e.target.value;
});

document.addEventListener('submit', (e) => {
  e.preventDefault();
  if (e.target.dataset.act !== 'submitSendback') return;
  const reason = (S.form.reason || '').trim();
  if (!reason) { S.form.error = 'Add a reason. It goes into the audit log.'; render(); return; }
  log(me().name, 'person', 'Sent back', P.label, reason, 'GST Desk sign-off');
  S.signoff = null; S.form = null;
  toast('Sent back to ' + PEOPLE.exec.name + '.'); render();
});

const fromHash = () => { const h = location.hash.slice(1); if (VIEWS.some(([k]) => k === h)) S.view = h; };
window.addEventListener('hashchange', () => { fromHash(); S.form = null; render(); });
document.getElementById('gstin').textContent = DATA.company.gstin;
fromHash();
render();
</script>

<style>

/* Layout: a working desk — header with role switch, tab bar, then list-and-detail panes. Gold marks only buttons where a person decides. */
:root {
  --bg: #f3f5f1; --surface: #ffffff; --surface-2: #eef2ee; --line: #d9e1db; --line-2: #c6d0c9;
  --ink: #111a19; --ink-2: #45524f; --ink-3: #66746f;
  --teal: #006d77; --teal-ink: #005c65; --teal-soft: #e0eeee; --on-teal: #ffffff;
  --sage: #899670; --sage-soft: #a3b18a;
  --gold: #ffd166; --gold-ink: #2b2100; --gold-line: #e9b53a;
  --good: #2e7744; --good-soft: #e2f0e5; --warn: #8f5600; --warn-soft: #f7ead3; --bad: #a93224; --bad-soft: #f7e0dc;
  --age0: #a3b18a; --age1: #6fa6ab; --age2: #e0ad45; --age3: #d4774e; --age4: #a93224;
  --shadow: 0 1px 2px rgb(17 26 25 / .06), 0 4px 16px rgb(17 26 25 / .05);
  --f-display: 'Playfair Display', Georgia, serif;
  --f-body: 'Lato', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1517; --surface: #101e21; --surface-2: #162a2e; --line: #22383c; --line-2: #2d4549;
  --ink: #f1f4ee; --ink-2: #b9c6c3; --ink-3: #8c9fa1;
  --teal: #0c7c86; --teal-ink: #5cc4cb; --teal-soft: #12353a; --on-teal: #ffffff;
  --good: #7cc493; --good-soft: #163128; --warn: #e6ad55; --warn-soft: #33290f; --bad: #f08c7e; --bad-soft: #3a1d19;
  --age0: #7f8c69; --age1: #4f8f95; --age2: #c9973a; --age3: #c86b44; --age4: #d65a48;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .25);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0b1517; --surface: #101e21; --surface-2: #162a2e; --line: #22383c; --line-2: #2d4549;

  --teal: #0c7c86; --teal-ink: #5cc4cb; --teal-soft: #12353a; --on-teal: #ffffff;
  --good: #7cc493; --good-soft: #163128; --warn: #e6ad55; --warn-soft: #33290f; --bad: #f08c7e; --bad-soft: #3a1d19;
  --age0: #7f8c69; --age1: #4f8f95; --age2: #c9973a; --age3: #c86b44; --age4: #d65a48;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .25);
  color-scheme: dark;
}

:focus-visible { outline: 2px solid var(--teal-ink); outline-offset: 2px; border-radius: 6px; }

.pts { font-family: var(--f-mono); font-weight: 500; }
.pts.pos { color: var(--good); } .pts.neg { color: var(--bad); }
.src { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.ceil { display: grid; gap: 6px; font-size: 13.5px; }
.ceil div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 10px; border-radius: 6px; }

.note { white-space: pre-wrap; font-size: 13.5px; line-height: 1.55; background: var(--surface-2); padding: 14px 16px; border-radius: 8px; border: 1px solid var(--line); }
.usage { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); min-width: 90px; overflow: hidden; }
.usage span { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
.usage::after { content: ''; position: absolute; top: -2px; bottom: -2px; left: calc(100% / 1.2); width: 2px; background: var(--ink-3); opacity: .5; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.form label { display: grid; gap: 4px; font-size: 13px; font-weight: 700; }
.form input, .form textarea { border: 1px solid var(--line-2); background: var(--surface); border-radius: 6px; padding: 8px 10px; font-weight: 400; }
.form .err { color: var(--bad); font-size: 13px; }
textarea.draft { width: 100%; min-height: 180px; border: 1px solid var(--line-2); border-radius: 8px; padding: 12px 14px; background: var(--surface); line-height: 1.55; resize: vertical; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--teal-soft); color: var(--teal-ink); font-weight: 700; }
.wa { background: #e7f1e4; color: #0b141a; border-radius: 10px; padding: 14px; display: grid; gap: 8px; }
.wa .bubble { background: #ffffff; border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; font-size: 14px; box-shadow: 0 1px 1px rgb(0 0 0 / .08); max-width: 520px; }

.guide { border-color: var(--gold-line); }
.guide ol { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; }
.guide a { color: var(--teal-ink); font-weight: 700; }
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.how div { padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); display: grid; gap: 6px; align-content: start; }
.how div.person { border-color: var(--gold-line); background: color-mix(in srgb, var(--gold) 14%, var(--surface)); }

.spark { width: 100%; height: 64px; display: block; }
.months { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-3); margin-top: 4px; }
.months span { display: grid; justify-items: center; gap: 1px; }

.conn td:first-child { font-weight: 700; }
.ok { color: var(--good); font-weight: 700; } .cfg { color: var(--warn); font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); z-index: 20; max-width: min(560px, calc(100vw - 32px)); }
.legend-gold { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-3); }
.legend-gold i { width: 12px; height: 12px; border-radius: 3px; background: var(--gold); border: 1px solid var(--gold-line); }

@media (max-width: 980px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid2, .split { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) { .roles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; } .roles .as { grid-column: 1 / -1; padding: 2px 6px; } .roles button { padding: 6px 8px; font-size: 13.5px; } .legend { grid-template-columns: repeat(2, minmax(0, 1fr)); } .how { grid-template-columns: minmax(0, 1fr); } .amounts { grid-template-columns: minmax(0, 1fr); } .amounts div { border-left: 0; border-top: 1px solid var(--line); } .amounts div:first-child { border-top: 0; } .brand h1 { font-size: 22px; } .detail { padding: 16px; } }
@media (prefers-reduced-motion: no-preference) { .row, .btn, nav.tabs a { transition: background-color .15s, border-color .15s, filter .15s; } }

/* IPO Room additions: the readiness board, request states and the related-party register. */
.board { display: grid; gap: 0; }

:root { --st-acc: var(--teal); --st-fix: var(--bad); --st-rev: var(--age2); --st-over: var(--age3); --st-soon: var(--sage-soft); --st-open: var(--line-2); }

<script>
// Reading amounts and dates as Indian ledgers and Excel exports write them.
(function (root) {
  const MONTHS = { JAN: 1, FEB: 2, MAR: 3, APR: 4, MAY: 5, JUN: 6, JUL: 7, AUG: 8, SEP: 9, OCT: 10, NOV: 11, DEC: 12 };

  function parseAmount(v) {
    if (typeof v === 'number') return v;
    let s = String(v == null ? '' : v).trim();
    const negative = /^\(.*\)$/.test(s) || /^-/.test(s);
    s = s.replace(/[()₹\s-]/g, '').replace(/^Rs\.?/i, '');
    let mult = 1;
    if (/cr(ore)?s?$/i.test(s)) { mult = 1e7; s = s.replace(/cr(ore)?s?$/i, ''); }
    else if (/(l|lakh|lakhs|lac|lacs)$/i.test(s)) { mult = 1e5; s = s.replace(/(lakhs|lakh|lacs|lac|l)$/i, ''); }
    const n = Number(s.replace(/,/g, ''));
    if (!Number.isFinite(n)) return NaN;
    return Math.round(n * mult * 100) / 100 * (negative ? -1 : 1);
  }

  function iso(y, m, d) {
    const dt = new Date(Date.UTC(y, m - 1, d));
    if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return null;
    return dt.toISOString().slice(0, 10);
  }

  // Excel serial 25569 = 1970-01-01.
  function fromSerial(n) {
    return new Date(Math.round((n - 25569) * 86400000)).toISOString().slice(0, 10);
  }

  function parseDate(v) {
    if (typeof v === 'number') return fromSerial(v);
    const s = String(v == null ? '' : v).trim();
    if (/^\d{5}(\.\d+)?$/.test(s)) return fromSerial(Number(s));
    let m;
    if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return iso(+m[1], +m[2], +m[3]);
    if ((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/))) return iso(+m[3], +m[2], +m[1]);

// IPO readiness: the bankers' and lawyers' document requests, a rules check on every upload, and a
// related-party watch over the ledger. The check and the watch flag; a person decides.
// Needs parse.js loaded first (for request-list dates).
(function (root) {
  const WORKSTREAMS = [
    { id: 'corporate', label: 'Corporate & secretarial', match: /corporate|secretar|statutory|roc/ },
    { id: 'financial', label: 'Financial', match: /financ|account|audit|restat/ },
    { id: 'legal', label: 'Legal & litigation', match: /legal|litigat|regulat|licen/ },
    { id: 'contracts', label: 'Material contracts', match: /contract|agreement|commercial/ },
    { id: 'hr', label: 'HR & key people', match: /\bhr\b|human|employ|people|managerial|kmp/ },
    { id: 'tax', label: 'Tax', match: /tax|gst|tds/ },
  ];
  const FILE_TYPES = ['pdf', 'xlsx', 'xls', 'csv'];
  const SIGNED = /digitally signed|signed by|sd\/-|signature\s*:/i;

  const fyLabel = (start) => 'FY ' + start + '-' + String(start + 1).slice(2);
  const fyOfDate = (iso) => { const y = Number(iso.slice(0, 4)), m = Number(iso.slice(5, 7)); return fyLabel(m >= 4 ? y : y - 1); };

  // Every financial year a document mentions, in the forms auditors and lawyers write them.
  function yearsIn(text) {
    const found = new Set();
    const t = String(text);
    for (const m of t.matchAll(/\bF\.?\s?Y\.?\s*(20\d{2})\s*[-–/]\s*(\d{2,4})\b/gi)) found.add(fyLabel(Number(m[1])));
    for (const m of t.matchAll(/\bFY\s?(\d{2})\b/gi)) found.add(fyLabel(2000 + Number(m[1]) - 1));
    for (const m of t.matchAll(/(?:as at|as on|ended)\s+(?:the\s+)?(?:31(?:st)?\s+march,?\s*(20\d{2})|march\s+31(?:st)?,?\s*(20\d{2}))/gi)) found.add(fyLabel(Number(m[1] || m[2]) - 1));
    return [...found];
  }

  // Rules check of an uploaded file against its request. The AI read, once a model key is added,
  // sits beside this and can only move a file to "needs review", never to "accepted" on its own.
  function checkUpload(req, file) {
    const fix = [], review = [];
    const ext = String(file.name || '').split('.').pop().toLowerCase();
    if (!FILE_TYPES.includes(ext)) fix.push('PDF or Excel expected, got .' + ext + '.');
    const text = String(file.text || '');
    if (!text.trim()) {
      review.push('No readable text: likely a scan. A person needs to look at it.');
    } else {
      const lower = text.toLowerCase();
      const kws = req.keywords || [];
      if (!kws.length) review.push('No checks set for this request: a person needs to look at it.');
      else if (!kws.some((k) => lower.includes(k.toLowerCase()))) review.push('Could not confirm this is the ' + req.title.toLowerCase() + ' (looked for: ' + kws.join(', ') + ').');
      if (/^FY \d{4}-\d{2}$/.test(req.period || '')) {
        const years = yearsIn(text);
        if (!years.length) review.push('Could not find the year in the document; ' + req.period + ' was asked for.');
        else if (!years.includes(req.period)) fix.push('Covers ' + years.join(', ') + '; ' + req.period + ' was asked for.');
      }
      if (req.signed && !SIGNED.test(text)) fix.push('Not signed: a signed copy was asked for.');
    }
    if (fix.length) return { verdict: 'needsFix', reasons: fix.concat(review) };
    if (review.length) return { verdict: 'needsReview', reasons: review };
    const fy = /^FY \d{4}-\d{2}$/.test(req.period || '') ? ', ' + req.period : '';
    return { verdict: 'accepted', reasons: ['Right document' + fy + (req.signed ? ', signed' : '') + '.'] };
  }

  const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
  function requestState(req, today) {
    if (req.check) return req.check.verdict;
    const left = daysBetween(today, req.due);
    return left < 0 ? 'overdue' : left <= 3 ? 'dueSoon' : 'open';
  }

  function readiness(requests, today) {
    return WORKSTREAMS.map((w) => {
      const rs = requests.filter((r) => r.workstream === w.id);
      const counts = { accepted: 0, needsFix: 0, needsReview: 0, overdue: 0, dueSoon: 0, open: 0 };
      for (const r of rs) counts[requestState(r, today)]++;
      return { id: w.id, label: w.label, total: rs.length, counts, pct: rs.length ? Math.round((counts.accepted / rs.length) * 100) : 0 };
    });
  }

  const ORDER = { overdue: 0, needsFix: 1, dueSoon: 2 };
  function reminders(requests, today) {
    const by = {};
    for (const r of requests) {
      const state = requestState(r, today);
      if (!(state in ORDER)) continue;
      (by[r.owner] = by[r.owner] || []).push({ ref: r.ref, title: r.title, due: r.due, state, daysLate: Math.max(0, daysBetween(r.due, today)), reason: r.check ? r.check.reasons.join(' ') : '' });
    }
    return Object.entries(by).map(([owner, items]) => ({ owner, items: items.sort((a, b) => ORDER[a.state] - ORDER[b.state] || a.due.localeCompare(b.due)) }));
  }

  // One request per row of the bankers' list. Headers are matched by name, not position.
  function mapRequestRow(row) {
    const used = new Set();
    const key = (test) => { const k = Object.keys(row).find((h) => !used.has(h) && test(h.toLowerCase())); if (k) used.add(k); return k; };
    const k = {
      ref: key((h) => /^(sr|ref|s\.?\s?no|#|id\b|item no)/.test(h)),
      workstream: key((h) => /category|workstream|section|head/.test(h)),
      due: key((h) => /due|target|by when/.test(h)),
      owner: key((h) => /responsib|owner|assigned|person/.test(h)),
      keywords: key((h) => /check for|keywords/.test(h)),
      signed: key((h) => /signed/.test(h)),
      period: key((h) => /period|year/.test(h)),
      title: key((h) => /document|description|item|particular|request/.test(h)),
    };
    const v = (name) => (k[name] ? String(row[k[name]] == null ? '' : row[k[name]]).trim() : '');
    const ws = WORKSTREAMS.find((w) => w.match.test(v('workstream').toLowerCase()));
    return {
      ref: v('ref'), workstream: ws ? ws.id : 'corporate', title: v('title'), period: v('period'), owner: v('owner'),
      due: root.Credit.parseDate(v('due')), keywords: v('keywords') ? v('keywords').split(/\s*;\s*/).filter(Boolean) : [],
      signed: /^(y|yes|true|1)$/i.test(v('signed')),
    };
  }

  // ---------- related parties ----------
  const SUFFIX = new Set(['pvt', 'private', 'ltd', 'limited', 'llp', 'inc', 'co', 'company', 'corp', 'corporation', 'the', 'm/s', 'ms']);
  function normaliseName(s) {
    return String(s || '').toLowerCase().replace(/&/g, ' and ').replace(/\./g, '').replace(/[^a-z0-9/]+/g, ' ')
      .split(' ').filter((t) => t && !SUFFIX.has(t)).join(' ');
  }
  function bigrams(s) { const g = new Map(); for (let i = 0; i < s.length - 1; i++) { const b = s.slice(i, i + 2); g.set(b, (g.get(b) || 0) + 1); } return g; }
  function dice(a, b) {
    if (a.length < 2 || b.length < 2) return 0;
    const ga = bigrams(a), gb = bigrams(b);
    let common = 0;
    for (const [k, n] of ga) common += Math.min(n, gb.get(k) || 0);
    return (2 * common) / (a.length - 1 + b.length - 1);
  }
  const CLOSE = 0.8;
  function matchParty(name, parties) {
    const n = normaliseName(name);
    if (!n) return null;
    const nt = n.split(' ');
    let best = null;
    const take = (m) => { if (!best || m.score > best.score) best = m; };
    for (const p of parties) {
      const pn = normaliseName(p.name);
      if (n === pn) return { party: p, kind: 'listed', score: 1, why: 'Same name as a listed party' };
      const pt = pn.split(' ');
      if (p.kind === 'person' && pt.length >= 2) {
        const surname = pt[pt.length - 1];
        if (nt.includes(surname) && nt[0].length === 1 && nt[0] === pt[0][0]) take({ party: p, kind: 'close', score: 0.85, why: 'Initial and surname match ' + p.name });
      }
      const [short, long] = nt.length <= pt.length ? [nt, pt] : [pt, nt];
      if (short.length >= 2 && short.every((t) => long.includes(t))) take({ party: p, kind: 'close', score: 0.9, why: 'Every word of ' + p.name + ' appears' });
      const d = dice(n, pn);
      if (d >= CLOSE) take({ party: p, kind: 'close', score: Math.round(d * 100) / 100, why: 'Spelt like ' + p.name + ' (' + Math.round(d * 100) + '% similar)' });
    }
    return best;
  }

  // Flags every ledger line with a listed or close counterparty, then totals by party, nature and
  // financial year (the shape the DRHP disclosure needs) and looks up the approval on file.
  function rptScan(txns, parties, approvals) {
    const flags = [];
    for (const t of txns) {
      const m = matchParty(t.party, parties);
      if (m) flags.push({ ...t, partyId: m.party.id, partyName: m.party.name, relation: m.party.relation, kind: m.kind, why: m.why, fy: fyOfDate(t.date) });
    }
    const groups = {};
    for (const f of flags) {
      const key = f.partyId + '|' + f.nature + '|' + f.fy;
      const g = (groups[key] = groups[key] || { key, partyId: f.partyId, partyName: f.partyName, relation: f.relation, nature: f.nature, fy: f.fy, count: 0, total: 0, close: 0, names: [] });
      g.count++; g.total += f.amount;
      if (f.kind === 'close') g.close++;
      if (!g.names.includes(f.party)) g.names.push(f.party);
    }
    const register = Object.values(groups).map((g) => ({
      ...g, total: Math.round(g.total * 100) / 100,
      approval: (approvals || []).find((a) => a.party === g.partyId && a.nature === g.nature && a.fy === g.fy) || null,
    })).sort((a, b) => a.partyName.localeCompare(b.partyName) || a.fy.localeCompare(b.fy) || a.nature.localeCompare(b.nature));
    return { flags, register };
  }

  const api = { WORKSTREAMS, checkUpload, yearsIn, fyOfDate, requestState, readiness, reminders, mapRequestRow, normaliseName, matchParty, rptScan };
  root.Credit = Object.assign(root.Credit || {}, api);
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

})();

function waiting() {
  const items = [];
  const id = me().id;
  const mineOpen = S.reqs.filter((r) => r.owner === id && ['needsFix', 'overdue', 'dueSoon'].includes(state(r)));
  if (mineOpen.length) items.push(['requests', 'mine', mineOpen.length + ' of your requests need a file', mineOpen.slice(0, 3).map((r) => r.ref).join(', ') + (mineOpen.length > 3 ? '…' : '')]);
  const toReview = S.reqs.filter((r) => state(r) === 'needsReview' && r.reviewer === id);
  if (toReview.length) items.push(['requests', 'review', 'Review ' + toReview.length + ' file' + (toReview.length > 1 ? 's' : ''), toReview.map((r) => r.ref + ' · uploaded by ' + P[r.history[r.history.length - 1].uploadedBy].name).join('; ')]);
  if (S.role === 'cs') {

    if (open.length) items.push(['parties', '', 'Decide ' + open.length + ' related-party groups', open.filter((g) => !g.approval).length + ' have no approval on file']);
  }
  return items;
}

function requestDetail(r) {

      ? `<form class="form" data-act="submitSendback" data-id="${r.ref}"><b>Send back to ${esc(P[r.owner].name)}</b><label>What needs to change (goes to the owner and the audit log)<textarea id="f-reason" rows="2" placeholder="e.g. upload the signed minutes, not a scan of the draft">${esc(S.form.reason || '')}</textarea></label>${S.form.error ? `<span class="err">${esc(S.form.error)}</span>` : ''}<div class="actions"><button class="btn teal" type="submit">Send back</button><button class="btn link" type="button" data-act="closeForm">Cancel</button></div></form>`

  }
  if (st !== 'accepted' && st !== 'needsReview') {
    if (r.owner === id) {
      const demo = r.ref === 'FIN-01' ? DATA.demoFiles : [{ name: r.ref + ' corrected.pdf', text: fileFor(r), corrected: true }];
      act += `<section><h4 class="label" style="margin-bottom:8px">Upload a file (demo: pick one)</h4><div class="files">${demo.map((d, i) => `<button class="btn" data-act="upload" data-id="${r.ref}" data-i="${i}">⇪ ${esc(d.name)} <span class="small">${r.ref === 'FIN-01' ? ['signed by the auditor', 'last year\'s accounts', 'draft, unsigned'][i] : 'the right document'}</span></button>`).join('')}</div></section>`;

  }
  return `<div class="detail">
    <div class="dhead"><div><span class="label">${r.ref} · ${WS[r.workstream]} · owner ${esc(P[r.owner].name)}</span><h3>${esc(r.title)}</h3></div>${chip(st)}</div>

      <div><span class="label">Latest file</span><span class="small">${last ? esc(last.name) + '<br><span class="muted">' + esc(P[last.uploadedBy].name) + ' · ' + fmtDate(last.uploadedAt) + '</span>' : '<span class="muted">Nothing uploaded yet</span>'}</span></div>

function viewConnections() {
  const rows = [
    ['Request list upload (Excel or CSV)', 'Live in demo', 'The bankers\' and lawyers\' list; columns matched by name', 'Nothing', 'One row per request with owner and date'],
    ['Data-room upload form', 'Live in demo', 'Each document, its text read on arrival', 'Nothing', 'The check result on the request'],
    ['Google Sheet', 'Live in demo', 'Requests, related-party list, approvals on file', 'Nothing', 'Requests, related-party register'],
    ['Gmail or Microsoft 365', 'Live in demo', 'Nothing', 'A mailbox the flows can send from', 'Reminders, fix requests, review requests, the CFO summary'],
    ['Virtual data room (Box, SharePoint, Google Drive)', 'Configured', 'New files in the request folders', 'A service account with read access to the room', 'Nothing: files stay where your bankers expect them'],
    ['TallyPrime', 'Configured', 'Day book for the related-party watch (XML on port 9000)', 'A small agent inside your network; the Tally port is never exposed', 'Nothing'],
    ['SAP Business One or Zoho Books', 'Configured', 'Journal and vendor ledgers', 'An API user with read access', 'Nothing'],
    ['AI read of documents', 'Needs a model key', 'The text of files the rules cannot settle', 'A model key added in n8n by you', 'A note to the reviewer; it never accepts a file'],
  ];
  return `
  <div class="pagehead"><h2>Connections</h2><span class="muted small">What this room reads, what it writes back, and what we need from your IT team</span></div>
  <section class="panel"><div class="tablewrap"><table class="conn">
    <thead><tr><th>System</th><th>Status</th><th>What we read</th><th>What we write back</th><th>What we need from you</th></tr></thead>
    <tbody>${rows.map(([n, s, r, need, w]) => `<tr><td>${n}</td><td class="${s === 'Live in demo' ? 'ok' : 'cfg'} small">${s}</td><td class="small">${r}</td><td class="small">${w}</td><td class="small">${need}</td></tr>`).join('')}</tbody>
  </table></div></section>
  <div class="grid2">
    <section class="panel pad"><h3 class="label" style="margin-bottom:10px">How it runs</h3>
      <div class="ceil">
        <div><span>1 · Document requests</span><span class="muted">list → owners → 09:00 reminders → Monday summary</span></div>
        <div><span>2 · Check an upload</span><span class="muted">file → text → document, year, signature → owner or reviewer</span></div>
        <div><span>3 · Related-party watch</span><span class="muted">Monday 07:00 → ledger → names → register → company secretary</span></div>
      </div>
      <p class="muted small" style="margin-top:10px">Three n8n workflows: visual, readable by your IT team, and running in your own cloud account.</p>
    </section>
    <section class="panel pad"><h3 class="label" style="margin-bottom:10px">Controls</h3>
      <ul class="small" style="margin:0;padding-left:18px;display:grid;gap:6px">
        <li>The person who uploads a file never accepts it. Files the company secretary uploads go to the CFO.</li>
        <li>Rules send a file back only for a reason they can show: wrong year, no signature, wrong file type.</li>
        <li>Related-party flags are decided by the company secretary, with a reason when marked not related. We do not give legal conclusions.</li>
        <li>Every file, check, reminder and decision is in the audit log.</li>
        <li>Documents stay in your data room and your cloud account.</li>
      </ul>
    </section>
  </div>`;
}

// ---------- render ----------
function render() {
  document.getElementById('roles').innerHTML = '<span class="as">Viewing as</span>' + ROLES.map((r) => `<button aria-pressed="${S.role === r}" data-act="role" data-role="${r}">${esc(BY_ROLE[r].name)}<span>${BY_ROLE[r].title}</span></button>`).join('');
  const w = waiting();
  const counts = { requests: w.filter(([v]) => v === 'requests').length ? S.reqs.filter((r) => (r.owner === me().id && ['needsFix', 'overdue', 'dueSoon'].includes(state(r))) || (state(r) === 'needsReview' && r.reviewer === me().id)).length : 0, parties: S.role === 'cs' ? RPT.register.filter((g) => !S.decisions[g.key]).length : 0 };
  document.getElementById('tabs').innerHTML = VIEWS.map(([k, l]) => `<a href="#${k}" data-act="goto" data-view="${k}" ${S.view === k ? 'aria-current="page"' : ''}>${l}${counts[k] ? `<span class="count num">${counts[k]}</span>` : ''}</a>`).join('');
  const v = { readiness: viewReadiness, requests: viewRequests, parties: viewParties, audit: viewAudit, connections: viewConnections }[S.view];
  document.getElementById('main').innerHTML = v();
}

// ---------- actions ----------
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t || t.tagName === 'FORM') return;
  const act = t.dataset.act, id = t.dataset.id;
  if (act === 'goto') { e.preventDefault(); S.view = t.dataset.view; S.form = null; if (t.dataset.filter) S.filter = t.dataset.filter; history.replaceState(null, '', '#' + S.view); render(); window.scrollTo({ top: 0 }); return; }
  if (act === 'open') { e.preventDefault(); S.view = 'requests'; S.filter = 'all'; S.sel = id; S.form = null; history.replaceState(null, '', '#requests'); render(); window.scrollTo({ top: 0 }); return; }
  if (act === 'role') { S.role = t.dataset.role; S.form = null; try { localStorage.setItem('ipoRoomRole', S.role); } catch (err) {} render(); return; }
  if (act === 'filter') { S.filter = t.dataset.k; S.form = null; render(); return; }
  if (act === 'auditFilter') { S.auditFilter = t.dataset.k; render(); return; }
  if (act === 'sel') { S.sel = id; S.form = null; render(); if (innerWidth <= 980) document.querySelector('main article')?.scrollIntoView({ block: 'start' }); return; }
  if (act === 'hideGuide') { S.guide = false; try { localStorage.setItem('ipoRoomGuide', 'hidden'); } catch (err) {} render(); return; }
  if (act === 'restart') { try { localStorage.removeItem('ipoRoomRole'); localStorage.removeItem('ipoRoomGuide'); } catch (err) {} location.hash = 'readiness'; location.reload(); return; }
  if (act === 'closeForm') { S.form = null; render(); return; }
  if (act === 'upload') {
    const r = S.reqs.find((x) => x.ref === id);
    const f = r.ref === 'FIN-01' ? DATA.demoFiles[Number(t.dataset.i)] : { name: r.ref + ' corrected.pdf', text: fileFor(r) };
    const check = C.checkUpload(r, f);
    const at = stamp();
    r.check = check; r.reviewer = check.verdict === 'needsReview' ? (me().id === 'kavya' ? 'anita' : 'kavya') : '';
    r.history.push({ name: f.name, uploadedBy: me().id, uploadedAt: at, check });
    log(me().name, 'person', 'File uploaded', r.ref, f.name, 'Data-room form · flow 2', at);
    log('Upload check', 'system', STATE[check.verdict].label, r.ref, check.reasons.join(' '), 'Rules check' + (r.reviewer ? ' · sent to ' + P[r.reviewer].name : check.verdict === 'needsFix' ? ' · ' + P[r.owner].name + ' emailed the reason' : ''));
    toast(check.verdict === 'accepted' ? r.ref + ' accepted: ' + check.reasons[0] : check.verdict === 'needsFix' ? 'Sent back: ' + check.reasons[0] : 'A person needs to look at it. Sent to ' + P[r.reviewer].name + '.');
    render(); return;
  }
  if (act === 'accept') {
    const r = S.reqs.find((x) => x.ref === id);
    const last = r.history[r.history.length - 1];
    r.check = { verdict: 'accepted', reasons: ['Accepted on review by ' + me().name + '.'] };
    last.acceptedBy = me().id; r.history[r.history.length - 1] = { ...last, check: last.check };
    log(me().name, 'person', 'Accepted on review', r.ref, last.name + ' · uploaded by ' + P[last.uploadedBy].name, 'Review in the IPO room');
    toast(r.ref + ' accepted.'); render(); return;
  }
  if (act === 'openSendback') { S.form = { ref: id }; render(); document.getElementById('f-reason')?.focus(); return; }
  if (act === 'openNotRelated') { S.form = { key: id }; render(); document.getElementById('f-reason')?.focus(); return; }
  if (act === 'decide') {
    const g = RPT.register.find((x) => x.key === id);
    S.decisions[id] = { kind: t.dataset.k, by: me().name };
    log(me().name, 'person', t.dataset.k === 'approved' ? 'Related: approval on file' : 'Taken to the audit committee', g.partyName, g.nature + ' · ' + g.fy + ' · ' + amt(g.total) + (g.approval ? ' · ' + g.approval.ref : ''), 'Related-party register');
    toast(t.dataset.k === 'approved' ? 'Marked related, approval ' + g.approval.ref + ' on file.' : 'Added to the audit committee agenda: ' + g.partyName + ', ' + g.nature + '.');
    render(); return;
  }
});

document.addEventListener('input', (e) => { if (S.form && e.target.id === 'f-reason') S.form.reason = e.target.value; });

document.addEventListener('submit', (e) => {
  e.preventDefault();
  const act = e.target.dataset.act, id = e.target.dataset.id;
  const reason = (S.form.reason || '').trim();
  if (!reason) { S.form.error = 'Add a reason. It goes into the audit log.'; render(); return; }
  if (act === 'submitSendback') {
    const r = S.reqs.find((x) => x.ref === id);
    r.check = { verdict: 'needsFix', reasons: [reason] };
    r.history[r.history.length - 1].check = r.check;
    r.reviewer = '';
    log(me().name, 'person', 'Sent back on review', r.ref, reason, P[r.owner].name + ' emailed the reason');
    S.form = null; toast('Sent back to ' + P[r.owner].name + '.'); render(); return;
  }
  if (act === 'submitNotRelated') {
    const g = RPT.register.find((x) => x.key === id);
    S.decisions[id] = { kind: 'notRelated', by: me().name, reason };
    log(me().name, 'person', 'Not related', g.names.join(', '), reason, 'Related-party register');
    S.form = null; toast('Marked not related. The reason is in the audit log.'); render();
  }
});

const fromHash = () => { const h = location.hash.slice(1); if (VIEWS.some(([k]) => k === h)) S.view = h; };
window.addEventListener('hashchange', () => { fromHash(); S.form = null; render(); });
fromHash();
render();
</script>
